<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quy trình</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #fff; color: #228B22; }
        .container { max-width: 1500px; margin: 32px auto 40px; padding: 0 20px; }
        .content-box { background: #fff8dc; border-radius: 8px; padding: 20px; box-shadow: 0 2px 4px rgba(0,0,0,.1); }
        .main-title { color: #228B22; font-weight: 700; text-align: center; margin-bottom: 8px; text-transform: uppercase; font-size: 1.6rem; }
        .doc-meta { color: #555; text-align: center; font-size: .9rem; font-style: italic; margin-bottom: 20px; }
        .back-btn { min-width: 160px; }
        .search-wrap { position: sticky; top: 0; z-index: 5; background: #fff8dc; padding: 10px 0 12px; }
        .search-hint, .scope-label { color: #555; font-size: .88rem; }
        .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
        .tabs button { flex: 1 1 150px; border: 1px solid #cfe3cf; border-radius: 8px; background: #fff; color: #176117; font-weight: 700; padding: 11px 12px; cursor: pointer; }
        .tabs button:hover, .tabs button.active { background: #eaf5e7; border-color: #228B22; }
        .panel { display: none; }
        .panel.active { display: block; }
        .card-block { border: 1px solid #cfe3cf; border-radius: 8px; background: #fff; padding: 14px 16px; margin-bottom: 10px; color: #2f2f2f; }
        .card-block h3 { color: #1f6f1f; font-size: 1rem; margin: 0 0 8px; }
        .summary-list { margin: 0; padding-left: 1.15rem; color: #2d3a2d; font-size: .9rem; }
        .summary-list li { margin-bottom: 7px; line-height: 1.5; }
        .summary-table { width: 100%; border-collapse: collapse; color: #2d3a2d; font-size: .88rem; }
        .summary-table th, .summary-table td { border: 1px solid #dcdcc0; padding: 7px 9px; vertical-align: top; }
        .summary-table th { background: #f2f8f0; color: #1f6f1f; text-align: left; }
        .policy-details { border: 1px solid #d8e8d2; border-radius: 7px; margin: 8px 0; background: #fbfdf9; }
        .policy-details summary { cursor: pointer; padding: 10px 12px; color: #1f6f1f; font-weight: 700; }
        .policy-details summary:hover { background: #eef7eb; }
        .policy-details .details-body { padding: 0 12px 12px; }
        .policy-note { border-left: 4px solid #228B22; background: #f2f8f0; padding: 10px 12px; margin: 8px 0 12px; color: #2d3a2d; }
        .flowchart-trigger { display: block; width: 100%; border: 1px solid #dcdcc0; border-radius: 6px; padding: 6px; background: #fff; cursor: zoom-in; }
        .flowchart-trigger img { display: block; width: 100%; max-height: 360px; object-fit: contain; }
        .flowchart-caption { color: #555; font-size: .88rem; margin: 6px 0 0; }
        .flowchart-dialog { border: 0; border-radius: 8px; padding: 12px; width: min(96vw, 1500px); max-width: none; max-height: 96vh; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
        .flowchart-dialog::backdrop { background: rgba(0,0,0,.78); }
        .flowchart-dialog img { display: block; width: 100%; max-height: calc(96vh - 70px); object-fit: contain; }
        mark { background: #ffe066; padding: 0 1px; }
        .placeholder { color: #777; font-style: italic; padding: 4px 0; }
        .no-result { color: #a33; font-weight: 600; padding: 14px 4px; }
        @media (max-width: 768px) {
            .container { padding: 0 12px; }
            .tabs { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content-box">
            <div class="d-flex justify-content-end mb-3">
                <button type="button" class="btn btn-secondary btn-sm fw-bold back-btn" onclick="window.history.back()">
                    <i class="bi bi-arrow-left"></i> Quay lại
                </button>
            </div>

            <h1 class="main-title">Quy trình và quy định nghiệp vụ</h1>
            <div class="doc-meta">Tra cứu tập trung các quy trình, quy định và hướng dẫn nghiệp vụ</div>

            <div class="search-wrap">
                <input id="documentSearch" type="text" class="form-control"
                    placeholder="Tra cứu nội dung: điều kiện vay, hồ sơ, lãi suất, tài sản bảo đảm...">
                <div class="d-flex flex-wrap align-items-center gap-2 mt-2">
                    <button type="button" id="closeAll" class="btn btn-outline-secondary btn-sm">Xóa tìm kiếm</button>
                </div>
                <div class="search-hint mt-1">Chọn một tab để xem nội dung. Kết quả tìm kiếm sẽ được tô sáng.</div>
            </div>

            <div class="tabs">
                <button type="button" class="active" data-tab="khcn">Quy trình tín dụng KHCN</button>
                <button type="button" data-tab="khbb">Quy trình tín dụng KHBB</button>
                <button type="button" data-tab="regulation">Quy chế cho vay</button>
                <button type="button" data-tab="authority">Thẩm quyền phê duyệt tín dụng</button>
                <button type="button" data-tab="cards">Chính sách thẻ tín dụng</button>
                <button type="button" data-tab="collateral">Chính sách bảo đảm tín dụng</button>
            </div>

            <div id="panels">
                <div class="panel active" id="panel-khcn"></div>
                <div class="panel" id="panel-khbb"></div>
                <div class="panel" id="panel-regulation"></div>
                <div class="panel" id="panel-authority"></div>
                <div class="panel" id="panel-cards"></div>
                <div class="panel" id="panel-collateral"></div>
            </div>
            <div id="noResult" class="no-result" style="display:none;">Không tìm thấy nội dung phù hợp.</div>
        </div>
    </div>

    <dialog class="flowchart-dialog" id="flowchartDialog" aria-label="Sơ đồ quy trình phóng to">
        <div class="d-flex justify-content-between align-items-center gap-3 mb-2">
            <strong id="flowchartDialogTitle"></strong>
            <button type="button" class="btn btn-secondary btn-sm" id="closeFlowchart">Đóng</button>
        </div>
        <img id="flowchartDialogImage" alt="">
    </dialog>

    <script src="credit-card-groups.js"></script>
    <script>
        const tabs = document.querySelectorAll(".tabs button");
        const noResult = document.getElementById("noResult");
        const search = document.getElementById("documentSearch");
        const panelData = {
            khcn: { title: "Quy trình tín dụng KHCN", sections: [
                {
                    title: "1. Phạm vi, vai trò và nguyên tắc kiểm soát",
                    keys: "khách hàng cá nhân KHCN phạm vi PGD cán bộ quan hệ khách hàng thẩm định phê duyệt độc lập xung đột lợi ích",
                    html: "<div class='policy-note'><strong>Nguồn:</strong> Quy trình tín dụng KHCN ban hành kèm QĐ 2507/QĐ-VCB-QLRRTD ngày 28/12/2020, sửa đổi bởi QĐ 510 ngày 31/12/2020 và QĐ 1074 ngày 25/06/2021 theo tài liệu cung cấp. Đối chiếu văn bản hiện hành, phân cấp thẩm quyền và quy định riêng của sản phẩm trước khi áp dụng.</div><ul class='summary-list'><li>Áp dụng tại Trụ sở chính và Chi nhánh cho cấp tín dụng khách hàng cá nhân; tài liệu loại trừ bao thanh toán, chiết khấu miễn truy đòi bộ chứng từ L/C và phát hành thẻ tín dụng.</li><li>CBKH tiếp nhận nhu cầu, thu thập thông tin và lập báo cáo nhu cầu tín dụng; CBTĐ thẩm định độc lập, chấm điểm/xếp hạng (nếu áp dụng), đề xuất tín dụng và theo dõi khoản vay; bộ phận CRC tác nghiệp, quản lý hồ sơ và giải ngân theo phân công.</li><li>Người thẩm định/người phê duyệt không xử lý khách hàng là chính mình hoặc người có liên quan theo quy định hiện hành.</li><li>PGD không có thẩm quyền phê duyệt tín dụng. Nếu PGD không bố trí CBTĐ, Lãnh đạo PGD thực hiện phần việc thẩm định; không vì vậy phát sinh thẩm quyền phê duyệt. PGD không được thẩm định, đề xuất cấp tín dụng nếu Lãnh đạo PGD có dưới 01 năm kinh nghiệm tín dụng và/hoặc không có CBKH PGD, trừ các khoản vay được bảo đảm đầy đủ bằng các tài sản thanh khoản được quy trình liệt kê (tiền, tiền gửi/tiết kiệm tại VCB, GTCG do VCB phát hành, trái phiếu Chính phủ, tín phiếu Kho bạc).</li></ul>"
                },
                {
                    title: "2. Tiếp nhận, thẩm định và trình phê duyệt",
                    keys: "tiếp nhận hồ sơ báo cáo nhu cầu tín dụng thẩm định nguồn trả nợ phương án xếp hạng rủi ro tài sản bảo đảm",
                    html: "<ol class='summary-list'><li><strong>Tiếp nhận:</strong> CBKH kiểm tra tính đầy đủ, hợp lệ, nhất quán của hồ sơ; làm rõ nhu cầu, mục đích sử dụng vốn, nguồn trả nợ và biện pháp bảo đảm; lập báo cáo nhu cầu tín dụng và chuyển hồ sơ cho CBTĐ.</li><li><strong>Thẩm định:</strong> CBTĐ kiểm tra tư cách pháp lý, sự phù hợp chính sách, tính khả thi và rủi ro của phương án, khả năng tài chính/trả nợ, lịch sử và xếp hạng tín dụng (nếu áp dụng), tài sản bảo đảm; có thể thu thập thêm thông tin và làm việc trực tiếp với khách hàng.</li><li><strong>Rà soát/phê duyệt:</strong> CBTĐ lập báo cáo thẩm định, Lãnh đạo Phòng/PGD rà soát; hồ sơ được trình cấp có thẩm quyền theo phân cấp hiện hành. Nếu vượt thẩm quyền, hoàn thiện ý kiến của cấp tại Chi nhánh rồi chuyển cấp có thẩm quyền tại Trụ sở chính.</li><li>Phê duyệt phải nêu rõ đồng ý/từ chối, điều kiện tín dụng và điều kiện thương mại; từ chối phải ghi rõ lý do. Thẩm định, phê duyệt giá trị tài sản bảo đảm thực hiện theo phân cấp riêng.</li></ol>"
                },
                {
                    title: "3. Hoàn thiện hợp đồng và điều kiện trước giải ngân",
                    keys: "hợp đồng tín dụng HĐTD hợp đồng bảo đảm đăng ký biện pháp bảo đảm nhập hệ thống lưu hồ sơ điều kiện giải ngân",
                    html: "<ul class='summary-list'><li>Sau phê duyệt, thông báo kết quả/điều kiện cho khách hàng; soạn và ký HĐTD, hợp đồng bảo đảm và văn bản liên quan đúng nội dung được duyệt. Nếu khách hàng không đồng ý điều kiện đã phê duyệt, thực hiện trình điều chỉnh thay vì tự thay đổi điều kiện.</li><li>Hoàn tất công chứng/chứng thực và đăng ký biện pháp bảo đảm khi pháp luật hoặc quy định VCB yêu cầu; kiểm tra các điều kiện tiên quyết và chứng từ chứng minh điều kiện đã hoàn thành.</li><li>CRC nhập thông tin khoản vay, hợp đồng và tài sản bảo đảm trên hệ thống; cấp kiểm soát đối chiếu dữ liệu với hồ sơ phê duyệt trước khi duyệt. Lưu trữ hồ sơ theo quy định.</li><li>Hồ sơ gốc từ PGD có kho/khu vực lưu trữ đạt chuẩn được chuyển về BPCRC chậm nhất ngày làm việc cuối cùng của tuần; PGD không có kho đạt chuẩn phải chuyển ngay trong ngày làm việc theo quy trình.</li></ul>"
                },
                {
                    title: "4. Kiểm tra hồ sơ rút vốn và giải ngân",
                    keys: "rút vốn giải ngân giấy nhận nợ chứng từ mục đích sử dụng vốn hạn mức còn lại điều kiện tín dụng",
                    html: "<ul class='summary-list'><li>Trước mỗi lần giải ngân, kiểm tra hồ sơ rút vốn, điều kiện phê duyệt/HĐTD, mục đích sử dụng vốn, số tiền đề nghị và hạn mức còn lại. Hồ sơ tối thiểu gồm giấy nhận nợ, chứng từ chứng minh mục đích sử dụng vốn và chứng từ thanh toán/rút tiền theo quy định.</li><li>CBTĐ lập thông báo tác nghiệp đủ điều kiện rút vốn; Lãnh đạo kiểm soát, sau đó CRC kiểm tra tính đầy đủ/hợp lệ, đối chiếu điều kiện và hạn mức, mở tài khoản vay nếu cần, trình duyệt hệ thống và hoàn tất tác nghiệp giải ngân.</li><li>Thiếu hoặc sai lệch hồ sơ/điều kiện thì yêu cầu bổ sung, chỉnh sửa; không giải ngân cho đến khi đáp ứng. Chứng từ sau giải ngân được chuyển cho khách hàng, bộ phận dịch vụ khách hàng và CRC lưu theo quy định.</li><li>Với PGD, hồ sơ scan màu được gửi để xử lý; hồ sơ gốc chuyển về BPCRC ngay trong ngày nếu không có kho đạt chuẩn, hoặc chậm nhất ngày làm việc cuối cùng của tuần nếu có kho đạt chuẩn.</li></ul>"
                },
                {
                    title: "5. Thu nợ, giám sát và xử lý dấu hiệu rủi ro",
                    keys: "thu nợ nhắc nợ lãi suất kiểm tra sử dụng vốn kiểm tra tại chỗ từ xa tần suất 6 tháng 12 tháng quá hạn nợ có vấn đề",
                    html: "<table class='summary-table'><thead><tr><th>Công việc</th><th>Mốc/tần suất theo quy trình</th></tr></thead><tbody><tr><td>Nhắc nợ đến hạn</td><td>CBTĐ chủ động nhắc/thông báo khách hàng trước ngày đến hạn; theo dõi thu đủ gốc, lãi và nghĩa vụ liên quan.</td></tr><tr><td>Kiểm tra tại chỗ - cấp tín dụng phục vụ kinh doanh</td><td>Tối thiểu 06 tháng/lần; đồng thời cập nhật tình hình tài chính theo quy trình.</td></tr><tr><td>Kiểm tra tại chỗ - vay tiêu dùng phục vụ đời sống</td><td>Lần đầu chậm nhất 01 tháng kể từ ngày giải ngân; các lần tiếp theo tối thiểu 12 tháng/lần.</td></tr><tr><td>Kiểm soát từ xa</td><td>Chậm nhất 06 tháng kể từ lần cấp tín dụng đầu tiên với khách hàng mới và/hoặc kể từ lần kiểm soát từ xa gần nhất. Nếu trùng kỳ kiểm tra tại chỗ, ghi nhận chung nhưng phải đủ nội dung của cả hai hình thức.</td></tr><tr><td>Điều chỉnh lãi suất</td><td>CRC cập nhật vào ngày điều chỉnh theo hợp đồng; gửi thông báo cho khách hàng muộn nhất ngày đầu tiên của kỳ tính lãi liền kề, theo hình thức đã thỏa thuận.</td></tr></tbody></table><ul class='summary-list mt-2'><li>Kiểm tra việc sử dụng vốn, khả năng trả nợ, tình hình tài chính/hoạt động, tài sản hình thành từ vốn vay và tình trạng TSBĐ; tăng kiểm tra đột xuất khi có dấu hiệu bất thường.</li><li>Khi có nguy cơ trả nợ không đúng hạn, đánh giá nguyên nhân và đề xuất biện pháp/điều chỉnh hoặc cơ cấu nợ theo đúng điều kiện, hồ sơ và thẩm quyền. Nợ quá hạn và khoản cấp tín dụng có vấn đề chuyển xử lý theo quy trình chuyên biệt.</li></ul>"
                },
                {
                    title: "6. Tất toán và giải chấp",
                    keys: "tất toán thanh lý hợp đồng đóng khoản vay giải chấp tài sản bảo đảm hoàn trả giấy tờ",
                    html: "<ul class='summary-list'><li>Sau khi thu hồi đầy đủ nợ gốc, lãi, phí và nghĩa vụ tài chính, kiểm tra điều kiện giải chấp theo hợp đồng và phê duyệt.</li><li>CRC lập thông báo đóng HĐTD/giải chấp, trình kiểm soát; thực hiện trả tài sản, hồ sơ tài sản và xóa đăng ký biện pháp bảo đảm (nếu cần) theo quy trình quản lý TSBĐ hiện hành.</li></ul>"
                }
            ] },
            khbb: { title: "Quy trình tín dụng KHBB", sections: [
                {
                    title: "1. Phạm vi và mô hình xử lý",
                    keys: "khách hàng bán buôn KHBB doanh nghiệp không phải định chế tài chính giới hạn tín dụng GHTD vai trò QHKH thẩm định CRC phê duyệt",
                    html: "<div class='policy-note'><strong>Nguồn:</strong> Quy trình tín dụng KHBB ban hành kèm QĐ 2503/QĐ-VCB-QLRRTD ngày 28/12/2018, sửa đổi bởi QĐ 512/QĐ-VCB-QLRRTD ngày 31/03/2020 theo tài liệu cung cấp. Đối chiếu quy định, thẩm quyền, sản phẩm và hướng dẫn mới nhất trước khi áp dụng.</div><ul class='summary-list'><li>Quy trình điều chỉnh việc xác định giới hạn tín dụng (GHTD) và cấp tín dụng cho khách hàng bán buôn không phải định chế tài chính; không bao gồm chiết khấu miễn truy đòi bộ chứng từ L/C.</li><li>CBKH quản lý quan hệ, tiếp nhận nhu cầu và thông tin; CBTĐ thẩm định GHTD/khoản cấp tín dụng và TSBĐ đặc thù; QLTĐ rà soát; CRC soạn hợp đồng, quản lý hồ sơ và tác nghiệp. Phòng Phê duyệt tín dụng thực hiện rà soát rủi ro với hồ sơ vượt thẩm quyền theo phân cấp.</li><li>Phân tách chức năng quan hệ khách hàng, thẩm định, rà soát rủi ro, phê duyệt và tác nghiệp; người thẩm định/phê duyệt không xử lý khách hàng liên quan theo quy định.</li></ul>"
                },
                {
                    title: "2. Đề xuất, phê duyệt và theo dõi GHTD",
                    keys: "GHTD giới hạn tín dụng hạn mức đề xuất rà soát rủi ro gia hạn điều chỉnh hiệu lực",

                {
                    title: "5. Quản lý, rà soát và xử lý tài sản",
                    keys: "quản lý hồ sơ TSBĐ hợp đồng công chứng đăng ký bảo hiểm định giá lại giảm giá trị bổ sung tài sản xử lý thu hồi nợ",
                    html: "<ul class='summary-list'><li>Hợp đồng bảo đảm phải xác định đúng bên, nghĩa vụ, tài sản, phạm vi và nội dung bảo đảm; công chứng/chứng thực, đăng ký biện pháp bảo đảm theo pháp luật và chính sách.</li><li>Quản lý bản gốc hồ sơ, hiện trạng, bảo hiểm và thời hạn định giá lại; phần lớn tài sản được định giá lại tối thiểu hằng năm, hàng hóa tối thiểu 06 tháng/lần. Theo dõi giá trị giảm, thứ tự ưu tiên, tình trạng tranh chấp và nghĩa vụ bổ sung.</li><li>Nếu tài sản giảm giá trị làm tỷ lệ bảo đảm không đạt yêu cầu, yêu cầu khách hàng bổ sung TSBĐ hoặc giảm dư nợ. Trường hợp khoản vay mua bất động sản đang hoàn thiện chuyển nhượng/thế chấp, chỉ áp dụng tỷ lệ thấp hơn nếu có quy định sản phẩm và biện pháp kiểm soát được cấp có thẩm quyền phê duyệt.</li><li>Khi nghĩa vụ đến hạn không được thực hiện, khách hàng vi phạm dẫn đến thu hồi trước hạn hoặc phát sinh trường hợp luật định, xử lý tài sản theo thỏa thuận và quy trình VCB; nếu tiền xử lý không đủ, khách hàng vẫn phải trả phần nghĩa vụ còn thiếu.</li></ul>"

        function fold(value) {
            return (value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .replace(/đ/gi, "d").toLowerCase();
        }

        function escapeHtml(value) {
            return (value || "").replace(/[&<>"']/g, (character) => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            }[character]));
        }

        function highlight(value, keyword) {
            if (!keyword) return escapeHtml(value);
            const raw = value || "";
            const folded = fold(raw);
            const needle = fold(keyword);
            if (!needle) return escapeHtml(raw);
            let output = "", cursor = 0, hit;
            while ((hit = folded.indexOf(needle, cursor)) !== -1) {
                output += escapeHtml(raw.slice(cursor, hit));
                output += "<mark>" + escapeHtml(raw.slice(hit, hit + needle.length)) + "</mark>";
                cursor = hit + needle.length;
            }
            return output + escapeHtml(raw.slice(cursor));
        }

        function renderCustomerGroupDirectory(container) {
            if (!container || !window.creditCardCustomerGroups) return;
            const limits = {
                "1": ["Chức danh do Bộ Chính trị quyết định", "01 tỷ VND"],
                "2": ["Chức danh do Ban Bí thư quyết định", "01 tỷ VND"],
                "3": ["Cán bộ quản lý cao cấp", "700 triệu VND"],
                "4": ["Quản lý cao cấp cấp Vụ và tương đương", "500 triệu VND"]
            };
            const groups = window.creditCardCustomerGroups;
            container.innerHTML = `<input type="search" class="form-control form-control-sm mb-2" data-group-search placeholder="Lọc cơ quan, đơn vị, chức danh trong nhóm 1-4...">` +
                Object.keys(limits).map((group) => {
                    const rows = groups[group] || [];
                    const rowsHtml = rows.map((row) => `<tr data-group-row data-search-text="${escapeHtml([row.agency, row.units, row.positions].join(" "))}"><td>${escapeHtml(row.agency)}</td><td>${escapeHtml(row.units)}</td><td>${escapeHtml(row.positions)}</td></tr>`).join("");
                    return `<details class="policy-details" data-group-details><summary>Nhóm ${group} - ${limits[group][0]} <span class="badge text-bg-success">${limits[group][1]}</span></summary><div class="details-body"><table class="summary-table"><thead><tr><th>Cơ quan</th><th>Đơn vị trực thuộc</th><th>Chức danh áp dụng</th></tr></thead><tbody>${rowsHtml}</tbody></table></div></details>`;
                }).join("");
            const groupSearch = container.querySelector("[data-group-search]");
            groupSearch.addEventListener("input", () => {
                const keyword = fold(groupSearch.value.trim());
                container.querySelectorAll("[data-group-details]").forEach((details) => {
                    let visible = 0;
                    details.querySelectorAll("[data-group-row]").forEach((row) => {
                        const matched = !keyword || fold(row.dataset.searchText).includes(keyword);
                        row.style.display = matched ? "" : "none";
                        if (matched) visible++;
                    });
                    details.style.display = visible ? "" : "none";
                    if (keyword && visible) details.open = true;
                });
            });
        }

        function applySearch() {
            const keyword = search.value.trim();
            const needle = fold(keyword);
            let matches = 0;
            Object.entries(panelData).forEach(([id, data]) => {
                const panel = document.getElementById("panel-" + id);
                if (data.placeholder) {
                    panel.innerHTML = `<div class="card-block"><h3>${data.title}</h3><p class="placeholder">Chưa có dữ liệu.</p></div>`;
                    panel.style.display = "";
                    return;
                }
                const sections = data.sections || [];
                const foundSections = sections.filter((section) => {
                    const searchableText = section.title + " " + section.keys + " " + section.html.replace(/<[^>]*>/g, " ");
                    return !needle || fold(searchableText).includes(needle);
                });
                const found = foundSections.length > 0;
                panel.style.display = found ? "" : "none";
                if (found) {
                    matches++;
                    panel.innerHTML = foundSections.map((section) => `
                        <div class="card-block searchable">
                            <h3>${highlight(section.title, keyword)}</h3>
                            ${section.html}
                        </div>
                    `).join("");
                    const customerGroupDirectory = panel.querySelector("#customerGroupDirectory");
                    renderCustomerGroupDirectory(customerGroupDirectory);
                }
            });
            noResult.style.display = needle && matches === 0 ? "block" : "none";
        }

        const flowchartDialog = document.getElementById("flowchartDialog");
        const flowchartDialogImage = document.getElementById("flowchartDialogImage");
        const flowchartDialogTitle = document.getElementById("flowchartDialogTitle");
        document.getElementById("panels").addEventListener("click", (event) => {
            const trigger = event.target.closest("[data-flowchart-src]");
            if (!trigger) return;
            flowchartDialogImage.src = trigger.dataset.flowchartSrc;
            flowchartDialogImage.alt = trigger.querySelector("img")?.alt || "";
            flowchartDialogTitle.textContent = trigger.dataset.flowchartTitle || "";
            flowchartDialog.showModal();
        });
        document.getElementById("closeFlowchart").addEventListener("click", () => flowchartDialog.close());
        flowchartDialog.addEventListener("click", (event) => {
            if (event.target === flowchartDialog) flowchartDialog.close();
        });

        document.getElementById("closeAll").addEventListener("click", () => {
            search.value = "";
            applySearch();
        });
        search.addEventListener("input", applySearch);
        tabs.forEach((tab) => tab.addEventListener("click", () => {
            tabs.forEach((item) => item.classList.remove("active"));
            document.querySelectorAll(".panel").forEach((panel) => panel.classList.remove("active"));
            tab.classList.add("active");
            document.getElementById("panel-" + tab.dataset.tab).classList.add("active");
            applySearch();
        }));
        applySearch();
    </script>
