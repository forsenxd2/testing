    <script type="application/json" id="loanRegulationSource">"NGÂN HÀNG TMCP NGOẠI THƯƠNG VIỆT NAM\n\nVĂN BẢN HỢP NHẤT QUY ĐỊNH VỀ CHO VAY ĐỐI VỚI KHÁCH HÀNG\nCỦA NGÂN HÀNG TMCP NGOẠI THƯƠNG VIỆT NAM\nBan hành kèm theo Quyết định số 268/QĐ-HĐQT-CSTD ngày 08/3/2017\nvà Quyết định số 1766/QĐ-HĐQT-QLRRTD ngày 30/8/2023\ncủa Hội đồng quản trị Ngân hàng TMCP Ngoại thương Việt Nam\n\n\fMỤC LỤC\nQUY ĐỊNH VỀ HOẠT ĐỘNG CHO VAY ĐỐI VỚI KHÁCH HÀNG CỦA\nNGÂN HÀNG TMCP NGOẠI THƯƠNG VIỆT NAM\n\nCHƯƠNG I. QUY ĐỊNH CHUNG ........................................................................................................1\nĐiều 1. Phạm vi điều chỉnh và đối tượng áp dụng ..................................................................................1\nĐiều 2. Giải thích và viết tắt từ ngữ..........................................................................................................1\nĐiều 3. Nguyên tắc áp dụng ......................................................................................................................4\nĐiều 5. Nguyên tắc cho vay, vay vốn.......................................................................................................5\nĐiều 6. Sử dụng ngôn ngữ ........................................................................................................................5\nĐiều 7. Điều kiện vay vốn.........................................................................................................................5\nĐiều 8. Những nhu cầu vốn không được cho vay ...................................................................................6\nĐiều 9. Những nhu cầu vốn cho vay đặc thù ...........................................................................................7\nĐiều 10. Hồ sơ đề nghị vay vốn..................................................................................................................7\nĐiều 11. Loại cho vay..................................................................................................................................8\nĐiều 12. Đồng tiền cho vay, trả nợ .............................................................................................................8\nĐiều 13. Mức cho vay .................................................................................................................................8\nĐiều 14. Lãi suất cho vay ............................................................................................................................8\nĐiều 15. Phí liên quan đến hoạt động cho vay........................................................................................ 10\nĐiều 16. Bảo đảm tiền vay ....................................................................................................................... 10\nĐiều 17. Cung cấp thông tin .................................................................................................................... 10\nĐiều 18. Thẩm định và quyết định cho vay ............................................................................................ 11\nĐiều 19. Trả nợ gốc và lãi tiền vay.......................................................................................................... 11\nĐiều 20. Cơ cấu lại thời hạn trả nợ ...................................................................................................... 12\nĐiều 21. Nợ quá hạn ............................................................................................................................... 13\nĐiều 22. Chấm dứt cho vay, xử lý nợ, miễn, giảm lãi tiền vay, phí ...................................................... 13\nĐiều 23. Thỏa thuận cho vay ................................................................................................................... 14\nĐiều 24. Biểu mẫu áp dụng khi cho vay ................................................................................................. 16\nĐiều 25. Kiểm tra sử dụng tiền vay ......................................................................................................... 17\nĐiều 26. Phạt vi phạm và bồi thường thiệt hại........................................................................................ 17\nĐiều 27. Các quy định khác ..................................................................................................................... 17\nCHƯƠNG II. QUY ĐỊNH CỤ THỂ ................................................................................................... 18\nMỤC 1. Hoạt động cho vay phục vụ hoạt động kinh doanh ........................................................... 18\nĐiều 28. Phương thức cho vay................................................................................................................. 18\nĐiều 29. Thời hạn cho vay ....................................................................................................................... 19\n\n\fĐiều 30. Lưu giữ hồ sơ cho vay............................................................................................................... 20\nMỤC 2. Hoạt động cho vay phục vụ nhu cầu đời sống .................................................................... 20\nĐiều 31. Phương thức cho vay................................................................................................................. 20\nĐiều 32. Thời hạn cho vay ....................................................................................................................... 21\nĐiều 33. Lưu giữ hồ sơ cho vay............................................................................................................... 21\nMỤC 3. Hoạt động cho vay bằng phương tiện điện tử ..................................................................... 22\nĐiều 33a. Nguyên tắc cho vay bằng phương tiện điện tử ...................................................................... 22\nĐiều 33b. Nhận biết, xác minh thông tin nhận biết khách hàng ............................................................ 23\nĐiều 33c. Dư nợ cho vay.......................................................................................................................... 24\nĐiều 33d. Hồ sơ đề nghị vay vốn ............................................................................................................ 24\nĐiều 33đ. Thẩm định và quyết định cho vay .......................................................................................... 24\nĐiều 33e. Thỏa thuận cho vay ................................................................................................................. 24\nĐiều 33g. Lưu giữ hồ sơ cho vay............................................................................................................. 24\nĐiều 33h. Phương tiện thanh toán được sử dụng để giải ngân vốn cho vay......................................... 25\nCHƯƠNG III. TỔ CHỨC THỰC HIỆN ........................................................................................... 25\nĐiều 34. Điều khoản chuyển tiếp............................................................................................................. 25\nĐiều 35. Tổ chức thực hiện ...................................................................................................................... 25\n\n\fQUY ĐỊNH VỀ CHO VAY ĐỐI VỚI KHÁCH HÀNG CỦA NGÂN HÀNG\nTMCP NGOẠI THƯƠNG VIỆT NAM\n(Ban hành kèm theo Quyết định số 268/QĐ-HĐQT-CSTD ngày 08/3/2017 và\nQuyết định số 1766/QĐ-HĐQT-QLRRTD ngày 30/8/2023\ncủa Hội đồng quản trị Ngân hàng TMCP Ngoại thương Việt Nam)\nCHƯƠNG I\nQUY ĐỊNH CHUNG\nĐiều 1.\n1.1.\n\nPhạm vi điều chỉnh và đối tượng áp dụng\n\nPhạm vi điều chỉnh\n\nQuy định này quy định về nghiệp vụ cho vay đối với khách hàng không\nphải là tổ chức tín dụng của Ngân hàng TMCP Ngoại thương Việt Nam.\n1.2.\n\nĐối tượng áp dụng\n\nQuy định này áp dụng thống nhất đối với Trụ sở chính, các Chi nhánh\ntrong hệ thống Ngân hàng TMCP Ngoại thương Việt Nam và các khách hàng vay\nvốn tại Ngân hàng TMCP Ngoại thương Việt Nam.\nĐiều 2.\n\nGiải thích và viết tắt từ ngữ\n\nTại Quy định này, các từ ngữ và chữ viết tắt dưới đây được hiểu như sau:\n2.1.\n\nCác chữ viết tắt:\n\n- NHNN\n\n: Ngân hàng Nhà nước Việt Nam\n\n- VCB\n\n: Ngân hàng TMCP Ngoại thương Việt Nam\n\n- HĐQT\n\n: Hội đồng quản trị VCB\n\n- Bộ luật Dân sự\n\n: Bộ luật Dân sự số 91/2015/QH13 ngày 24/11/2015 và\ncác văn bản sửa đổi, bổ sung, thay thế (nếu có)\n\n- Thông tư 39\n\n: Thông tư số 39/2016/TT-NHNN ngày 30/12/2016 của\nNHNN quy định về hoạt động cho vay của tổ chức tín\ndụng, chi nhánh ngân hàng nước ngoài đối với khách\nhàng và các văn bản sửa đổi, bổ sung, thay thế (nếu có).\n\n- TCTD\n\n: Tổ chức tín dụng\n\nCho vay là hình thức cấp tín dụng, theo đó VCB giao hoặc cam kết\ngiao cho khách hàng một khoản tiền để sử dụng vào mục đích xác định trong một\nthời gian nhất định theo thỏa thuận với nguyên tắc có hoàn trả cả gốc và lãi.\n2.2.\n\n1\n\n\f2.3. Cho vay phục vụ nhu cầu đời sống là việc VCB cho vay đối với\nkhách hàng là cá nhân để thanh toán các chi phí cho mục đích tiêu dùng, sinh\nhoạt của cá nhân đó, gia đình của cá nhân đó.\n2.4. Cho vay phục vụ hoạt động kinh doanh, hoạt động khác (sau\nđây gọi là hoạt động kinh doanh) là việc VCB cho vay đối với khách hàng là\npháp nhân, cá nhân nhằm đáp ứng nhu cầu vốn ngoài quy định tại khoản 2.3 Điều\nnày, bao gồm nhu cầu vốn của pháp nhân, cá nhân đó và nhu cầu vốn của hộ kinh\ndoanh, doanh nghiệp tư nhân mà cá nhân đó là chủ hộ kinh doanh, chủ doanh\nnghiệp tư nhân.\n2.5. Cơ cấu lại thời hạn trả nợ là việc VCB chấp thuận điều chỉnh kỳ\nhạn trả nợ, gia hạn nợ như sau:\na)\nĐiều chỉnh kỳ hạn trả nợ là việc VCB chấp thuận kéo dài thêm một\nkhoảng thời gian trả nợ một phần hoặc toàn bộ nợ gốc và/hoặc lãi tiền vay của kỳ\nhạn trả nợ đã thỏa thuận (bao gồm cả trường hợp không thay đổi về số kỳ hạn trả nợ\nđã thỏa thuận), thời hạn cho vay không thay đổi;\nb)\nGia hạn nợ là việc VCB chấp thuận kéo dài thêm một khoảng thời gian\ntrả nợ gốc và/hoặc lãi tiền vay, vượt quá thời hạn cho vay đã thoả thuận.\n2.6.\na)\nđịnh này;\n\nDư nợ gốc bị quá hạn bao gồm:\nSố dư nợ gốc bị chuyển nợ quá hạn theo quy định tại Điều 21 Quy\n\nb)\nSố dư nợ gốc mà khách hàng không trả được nợ trước hạn khi VCB\nchấm dứt cho vay, thu hồi nợ trước hạn theo quy định tại khoản 22.1 Điều 22 Quy\nđịnh này.\nDư nợ gốc bị quá hạn là căn cứ để áp dụng lãi trên dư nợ gốc bị quá hạn\ntheo quy định tại điểm c khoản 14.5 Điều 14 Quy định này.\n2.7. Đơn vị là các Chi nhánh của VCB và các Phòng/Ban/Trung tâm tại\nTrụ sở chính trực tiếp tham gia vào quá trình cho vay đối với khách hàng.\n2.8. Khách hàng vay vốn tại VCB (sau đây gọi là khách hàng) là pháp\nnhân, cá nhân, bao gồm:\na)\nPháp nhân được thành lập và hoạt động tại Việt Nam, pháp nhân được\nthành lập ở nước ngoài và hoạt động hợp pháp tại Việt Nam. Đơn vị căn cứ quy định\ntại Điều 74 Bộ luật Dân sự, các quy định có liên quan của pháp luật để xác định\nkhách hàng là pháp nhân được vay vốn.\nb)\n\nCá nhân có quốc tịch Việt Nam, cá nhân có quốc tịch nước ngoài.\n\n2.9. Khả năng tài chính là khả năng về vốn, tài sản, các nguồn tài chính\nhợp pháp khác của khách hàng.\n2\n\n\f2.10. Khoản nợ là số tiền VCB giải ngân cho Khách hàng theo quy định\ntại Thỏa thuận cho vay và được theo dõi theo từng tài khoản vay.\n2.11. Kỳ hạn trả nợ là các khoảng thời gian trong thời hạn cho vay đã\nthỏa thuận mà tại cuối mỗi khoảng thời gian đó khách hàng phải trả một phần\nhoặc toàn bộ nợ gốc và/hoặc lãi tiền vay cho VCB.\n2.12. Người không cư trú được xác định theo quy định của pháp luật về\nquản lý và sử dụng ngoại hối.\n2.13. Phương án sử dụng vốn là tập hợp các thông tin về việc sử dụng\nvốn của khách hàng, trong đó phải có các thông tin:\na)\nTổng nguồn vốn cần sử dụng, chi tiết các loại nguồn vốn trong tổng\nnguồn vốn cần sử dụng (trong đó có nguồn vốn cần vay tại VCB); mục đích sử dụng\nvốn; thời gian sử dụng vốn;\nb)\n\nNguồn trả nợ của khách hàng;\n\nc)\nPhương án, dự án thực hiện hoạt động kinh doanh hoặc phương án,\ndự án phục vụ nhu cầu đời sống để mua nhà ở; xây dựng, cải tạo nhà ở; nhận\nchuyển nhượng quyền sử dụng đất để xây nhà ở.\n2.14. Sản phẩm là (các) sản phẩm cho vay được ban hành theo chính sách\nphát triển sản phẩm và/hoặc chương trình cho vay bán lẻ được ban hành theo quy\ntrình phát triển chương trình cho vay bán lẻ của VCB.\n2.15. Thỏa thuận cho vay là thỏa thuận giữa VCB với khách\nhàng để xác lập quan hệ cho vay của VCB với khách hàng. Thỏa thuận cho vay\nđược lập thành văn bản, trường hợp là hợp đồng điện tử thực hiện theo quy định\ncủa pháp luật về giao dịch điện tử, và có tối thiểu các nội dung theo quy định tại\nĐiều 23 Quy định này. Thỏa thuận cho vay có thể được thể hiện dưới hình thức\nhợp đồng cho vay và hình thức khác phù hợp với quy định của pháp luật.\n2.16. Thời hạn cho vay là khoảng thời gian được tính từ ngày tiếp theo của\nngày VCB giải ngân vốn vay cho khách hàng cho đến thời điểm khách hàng phải\ntrả hết nợ gốc và lãi tiền vay theo thỏa thuận của VCB và khách hàng. Trường hợp\nngày cuối cùng của thời hạn cho vay là ngày lễ hoặc ngày nghỉ hàng tuần, thì\nchuyển sang ngày làm việc tiếp theo. Đối với thời hạn cho vay không đủ một ngày\nthì thực hiện theo quy định tại Bộ luật Dân sự về thời điểm bắt đầu thời hạn.\n2.17. Thời hạn trả lãi của dư nợ gốc trong hạn là khoảng thời gian 07\n(bảy) ngày được tính từ ngày lên phiếu tính lãi (bill lãi). VCB được thu lãi của\nkhách hàng trong khoảng thời gian của thời hạn trả lãi. Ngày đến hạn trả lãi của dư\nnợ gốc trong hạn là ngày cuối cùng của thời hạn trả lãi của dư nợ gốc trong hạn.\nViệc xác định ngày lên phiếu tính lãi được thực hiện theo hướng dẫn của\nTổng Giám đốc.\n3\n\n\f2.18. Cho vay bù đắp tài chính là việc TCTD cho khách hàng vay để bù\n\nđắp các chi phí đã thanh toán, chi trả bằng vốn của chính khách hàng, vốn vay từ\ncá nhân, tổ chức (không phải tổ chức tín dụng) nhằm thực hiện phương án, dự án\nhoạt động kinh doanh hoặc phương án, dự án phục vụ nhu cầu đời sống.\nCác từ ngữ khác không nêu tại Quy định này được hiểu thống nhất theo\nquy định của pháp luật hiện hành và các văn bản quy phạm nội bộ khác của VCB.\nĐiều 3.\n\nNguyên tắc áp dụng\n\n3.1. Đơn vị thực hiện nghiệp vụ cho vay theo quy định tại Luật các TCTD,\nThông tư 39, Quy định này, các quy định khác có liên quan của pháp luật hiện hành\nvà của VCB.\n3.2. Trường hợp có sự thay đổi quy định của pháp luật dẫn đến việc áp\ndụng Quy định này trái với các quy định của pháp luật thì thực hiện theo quy\nđịnh mới của pháp luật.\n3.3. Các hoạt động cho vay cụ thể được quy định tại văn bản riêng của\nChính phủ, Thủ tướng Chính phủ và NHNN, thì thực hiện như sau:\n3.3.1. Các hoạt động cho vay cụ thể bao gồm:\na)\n\nHoạt động cho vay hợp vốn;\n\nb)\n\nHoạt động cho vay đối với khách hàng để đầu tư ra nước ngoài;\n\nc)\nHoạt động cho vay đối với khách hàng thực hiện hoạt động kinh\ndoanh thuộc các chính sách, chương trình kinh tế - xã hội của Chính phủ, Thủ\ntướng Chính phủ;\nd)\n\nHoạt động cho vay bằng ngoại tệ đối với khách hàng là người cư trú;\n\ne)\nHoạt động cho vay, thu nợ nước ngoài đối với khách hàng là người\nkhông cư trú;\nf)\nCác hoạt động cho vay cụ thể khác được quy định tại văn bản riêng\ncủa Chính phủ, Thủ tướng Chính phủ, NHNN.\n3.3.2. Các hoạt động cho vay cụ thể quy định tại điểm 3.3.1 Khoản này\nthực hiện theo quy định tại văn bản riêng của Chính phủ, Thủ tướng Chính phủ,\nNHNN và các văn bản hướng dẫn của VCB.\n3.3.3. Trường hợp văn bản riêng của Chính phủ, Thủ tướng Chính phủ và\nNHNN có quy định việc áp dụng Thông tư 39 hoặc các nội dung liên quan đến\nhoạt động cho vay không được quy định tại văn bản riêng, thì thực hiện theo quy\nđịnh có liên quan tại Thông tư 39 và Quy định này.\n3.3.4. Tổng Giám đốc hướng dẫn thực hiện các hoạt động cho vay cụ thể\nđược quy định tại văn bản riêng của Chính phủ, Thủ tướng Chính phủ và NHNN;\ntrừ (i) các hoạt động cho vay cụ thể có liên quan đến khách hàng vay là người\n4\n\n\fkhông cư trú và/hoặc phương án sử dụng vốn tại nước ngoài và (ii) các hoạt động\ncho vay cụ thể mà văn bản riêng của Chính phủ, Thủ tướng Chính phủ và NHNN\ncó quy định cấp thẩm quyền của TCTD ban hành hướng dẫn là HĐQT thì do\nHĐQT quy định.\nĐiều 4.\n\nQuyền tự chủ của VCB\n\n4.1. VCB có quyền tự chủ trong hoạt động cho vay và tự chịu trách\nnhiệm về quyết định cho vay của mình. Không tổ chức, cá nhân nào được can\nthiệp trái pháp luật vào hoạt động cho vay của VCB.\n4.2. VCB có quyền từ chối các yêu cầu của khách hàng không đúng với\nquy định tại Quy định này và thỏa thuận cho vay.\nĐiều 5.\n\nNguyên tắc cho vay, vay vốn\n\n5.1. Hoạt động cho vay của VCB đối với khách hàng được thực hiện\ntheo thỏa thuận giữa VCB và khách hàng, phù hợp với Quy định này và các quy\nđịnh của pháp luật có liên quan bao gồm cả pháp luật về bảo vệ môi trường.\n5.2. Khách hàng vay vốn phải đảm bảo sử dụng vốn vay đúng mục đích,\nhoàn trả nợ gốc và lãi tiền vay đúng thời hạn đã thỏa thuận với VCB.\nĐiều 6.\n\nSử dụng ngôn ngữ\n\n6.1. Thỏa thuận cho vay được lập bằng tiếng Việt hoặc đồng thời bằng\ntiếng Việt và tiếng nước ngoài. Trong trường hợp thỏa thuận cho vay được lập\nđồng thời bằng tiếng Việt và tiếng nước ngoài thì phải xác định rõ ngôn ngữ được\nưu tiên sử dụng để giải quyết tranh chấp.\n6.2. Đối với các tài liệu khác trong hoạt động cho vay sử dụng tiếng\nnước ngoài, khi cơ quan có thẩm quyền yêu cầu dịch sang tiếng Việt, thì bản dịch\nphải có xác nhận của Giám đốc/Phó Giám đốc Chi nhánh (đối với khoản cho vay\nthuộc Chi nhánh), Giám đốc/Phó Giám đốc Ban Khách hàng doanh nghiệp hoặc\nTrưởng Ban/Phó Trưởng Ban Định chế tài chính tại Trụ sở chính (đối với khoản\ncho vay thuộc Trụ sở chính theo đối tượng khách hàng quản lý) hoặc phải được\ncông chứng hoặc chứng thực.\nĐiều 7.\n\nĐiều kiện vay vốn\n\nVCB xem xét, quyết định cho vay khi khách hàng có đủ các điều kiện sau\nđây:\n7.1. Khách hàng là pháp nhân có năng lực pháp luật dân sự theo quy định\ncủa pháp luật. Khách hàng là cá nhân từ đủ 18 tuổi trở lên có năng lực hành vi\ndân sự đầy đủ theo quy định của pháp luật hoặc từ đủ 15 tuổi đến chưa đủ 18 tuổi\nkhông bị mất hoặc hạn chế năng lực hành vi dân sự theo quy định của pháp luật\n7.2.\n\nNhu cầu vay vốn để sử dụng vào mục đích hợp pháp\n5\n\n\fa)\n\nMục đích sử dụng vốn phù hợp với quy định pháp luật.\n\nb) Nhu cầu vay vốn của khách hàng không thuộc nhu cầu vay vốn\nkhông được cho vay theo quy định của pháp luật và quy định của VCB.\n7.3.\n\nCó phương án sử dụng vốn khả thi\n\na) Ngoài nguồn vốn vay của VCB, Khách hàng có khả năng thu xếp\n(các) nguồn vốn cần sử dụng theo phương án sử dụng vốn.\nb) Phương án, dự án thực hiện hoạt động kinh doanh hoặc phương án,\ndự án phục vụ nhu cầu đời sống để mua nhà ở; xây dựng, cải tạo nhà ở; nhận\nchuyển nhượng quyền sử dụng đất để xây nhà ở khả thi.\n7.4.\n\nCó khả năng tài chính để trả nợ\n\nKhách hàng có khả năng về vốn, tài sản, các nguồn tài chính hợp pháp\nkhác để trả nợ phù hợp với thời hạn cho vay.\n\nĐiều 8.\n\nNhững nhu cầu vốn không được cho vay\n\nĐơn vị không được cho vay đối với các nhu cầu vốn:\n8.1. Để thực hiện các hoạt động đầu tư kinh doanh thuộc ngành, nghề\ncấm đầu tư kinh doanh theo quy định của Luật Đầu tư.\n8.2. Để thanh toán các chi phí, đáp ứng các nhu cầu tài chính của hoạt\nđộng đầu tư kinh doanh thuộc ngành, nghề cấm đầu tư kinh doanh khác theo quy\nđịnh của Luật Đầu tư và các giao dịch, hành vi mà pháp luật cấm.\n8.3. Để mua, sử dụng các hàng hóa, dịch vụ thuộc ngành, nghề cấm đầu\ntư kinh doanh theo quy định của Luật Đầu tư.\n8.4.\n\nĐể mua vàng miếng.\n\n8.5. Để trả nợ khoản cấp tín dụng tại chính VCB trừ trường hợp cho vay\nđể thanh toán lãi tiền vay phát sinh trong quá trình thi công xây dựng công trình,\nmà chi phí lãi tiền vay được tính trong tổng mức đầu tư xây dựng được cấp có\nthẩm quyền phê duyệt theo quy định của pháp luật.\n8.6. Để trả nợ khoản vay nước ngoài (không bao gồm khoản vay nước\nngoài dưới hình thức mua bán hàng hóa trả chậm), khoản cấp tín dụng tại tổ chức\ntín dụng khác; trừ trường hợp được quy định tại khoản 9.1 Điều 9 Quy định này.\n8.7. Để gửi tiền.\n\n6\n\n\fĐiều 9.\n\nNhững nhu cầu vốn cho vay đặc thù\n\nCác nhu cầu vốn Đơn vị được thực hiện cho vay theo hướng dẫn của Tổng\nGiám đốc và/hoặc theo quy định tại sản phẩm như sau:\n9.1. Để trả nợ trước hạn khoản vay tại tổ chức tín dụng khác và trả nợ\ntrước hạn khoản vay nước ngoài (không bao gồm khoản vay nước ngoài dưới\nhình thức mua bán hàng hóa trả chậm) trên cơ sở đáp ứng tối thiểu các điều kiện\nđược quy định tại Quy định này:\n\na) Thời hạn cho vay không vượt quá thời hạn cho vay còn lại của\nkhoản vay cũ;\nb) Là khoản vay chưa thực hiện cơ cấu lại thời hạn trả nợ.\n9.2.\n\nĐể góp vốn vào doanh nghiệp.\n9.3.\n\nĐể bù đắp tài chính.\n\n9.4.\n\nĐể đầu tư, kinh doanh chứng khoán.\n\nphiếu.\n\n9.5. Để thanh toán tiền góp vốn theo hợp đồng góp vốn, hợp đồng hợp\ntác đầu tư hoặc hợp đồng hợp tác kinh doanh để thực hiện dự án đầu tư. Riêng\nđối với khoản vay thuộc thẩm quyền phê duyệt của các cấp có thẩm quyền từ Hội\nđồng tín dụng Trung ương trở lên, Đơn vị có thể đề xuất và trình cấp có thẩm\nquyền phê duyệt theo quy trình tín dụng của VCB trong từng thời kỳ.\n9.6. Để thanh toán tiền nhằm đảm bảo thực hiện nghĩa vụ trên cơ sở đáp\nứng tối thiểu điều kiện VCB phải phong tỏa tiền giải ngân vốn cho vay tại VCB\ntheo quy định của pháp luật, thỏa thuận của các bên tại thỏa thuận cho vay cho\nđến khi chấm dứt nghĩa vụ bảo đảm.\n9.7.\n\nĐể kinh doanh dịch vụ cầm đồ.\n\n9.8. Để kinh doanh sản xuất, gia công vàng trang sức mỹ nghệ (không\nphải vàng miếng).\nĐiều 10. Hồ sơ đề nghị vay vốn\n10.1. Khi có nhu cầu vay vốn, khách hàng phải gửi cho VCB các tài liệu\nchứng minh đủ điều kiện vay vốn theo quy định tại Điều 7 Quy định này, bao gồm:\na)\n\nPhương án sử dụng vốn, trong đó nêu rõ nhu cầu vay vốn tại VCB;\n\nb)\n\nCác tài liệu về hồ sơ pháp lý của khách hàng còn hiệu lực;\n\nc)\nBáo cáo thực trạng tài chính của khách hàng (đối với khách hàng\nvay phục vụ hoạt động kinh doanh): Báo cáo tài chính nộp cho cơ quan nhà nước\ncó thẩm quyền và/hoặc báo cáo tài chính đã kiểm toán đối với trường hợp khách\n7\n\n\fhàng phải lập báo cáo theo quy định của pháp luật, báo cáo tình hình tài chính\ncủa khách hàng theo hướng dẫn của VCB; báo cáo tình hình thu nhập của khách\nhàng (đối với khách hàng vay phục vụ nhu cầu đời sống);\nd)\n\nCác tài liệu liên quan đến mục đích vay;\n\ne)\n\nHồ sơ bảo đảm tiền vay (nếu có).\n\n10.2. Căn cứ tình hình thực tế và đặc điểm cụ thể của từng loại hình, nhu\ncầu cho vay, từng đối tượng khách hàng, danh mục các loại giấy tờ, tài liệu khách\nhàng phải gửi cho VCB để phục vụ cho việc thẩm định, quyết định cho vay được\nthực hiện theo quy định tại các quy trình tín dụng, sản phẩm và các văn\nbản quy định khác của VCB.\nĐiều 11. Loại cho vay\nĐơn vị xem xét quyết định cho khách hàng vay theo các loại cho vay\nnhư sau:\n11.1. Cho vay ngắn hạn là các khoản vay có thời hạn cho vay tối đa 01\n(một) năm.\n11.2. Cho vay trung hạn là các khoản vay có thời hạn cho vay trên 01\n(một) năm và tối đa 05 (năm) năm.\n11.3. Cho vay dài hạn là các khoản vay có thời hạn cho vay trên 05\n(năm) năm.\nĐiều 12. Đồng tiền cho vay, trả nợ\n12.1. Đơn vị và khách hàng thỏa thuận về việc cho vay bằng đồng Việt\nNam hoặc bằng ngoại tệ phù hợp với quy định tại Quy định này và quy định của\npháp luật, quy định của VCB có liên quan.\n12.2. Đồng tiền trả nợ là đồng tiền cho vay của khoản vay. Trường hợp trả\nnợ bằng đồng tiền khác, thì thực hiện theo thỏa thuận giữa Đơn vị và khách hàng\nphù hợp với quy định của pháp luật liên quan và quy định nội bộ VCB.\nĐiều 13. Mức cho vay\nĐơn vị căn cứ vào phương án sử dụng vốn, khả năng tài chính của khách\nhàng, các giới hạn cấp tín dụng đối với khách hàng và khả năng nguồn vốn của\nVCB để thỏa thuận với khách hàng về mức cho vay.\nĐiều 14. Lãi suất cho vay\n14.1. Đơn vị và khách hàng thỏa thuận về lãi suất cho vay theo cung cầu\nvốn thị trường, nhu cầu vay vốn, mức độ tín nhiệm của khách hàng và phù hợp\nvới thông báo lãi suất của VCB trong từng thời kỳ, trừ trường hợp NHNN có quy\nđịnh về lãi suất cho vay tối đa tại khoản 14.2 Điều này.\n14.2. Trường hợp khách hàng được Đơn vị đánh giá là có tình hình tài\n8\n\n\fchính minh bạch, lành mạnh, Đơn vị và khách hàng thỏa thuận về lãi suất cho vay\nngắn hạn bằng đồng Việt Nam nhưng không vượt quá mức lãi suất cho vay tối đa\ndo Thống đốc NHNN quyết định trong từng thời kỳ nhằm đáp ứng một số nhu\ncầu vốn:\na)\nPhục vụ lĩnh vực phát triển nông nghiệp, nông thôn theo quy định\ncủa Chính phủ về chính sách tín dụng phục vụ phát triển nông nghiệp, nông thôn;\nb)\nThực hiện phương án kinh doanh hàng xuất khẩu theo quy định tại\nLuật thương mại và các văn bản hướng dẫn Luật thương mại;\nc)\nPhục vụ kinh doanh của doanh nghiệp nhỏ và vừa theo quy định của\nLuật Hỗ trợ doanh nghiệp nhỏ và vừa và quy định của Chính phủ về hỗ trợ doanh\nnghiệp nhỏ và vừa;\nd)\nPhát triển ngành công nghiệp hỗ trợ theo quy định của Chính phủ về\nphát triển công nghiệp hỗ trợ;\ne)\nPhục vụ kinh doanh của doanh nghiệp ứng dụng công nghệ cao\nthuộc Danh mục công nghệ cao ưu tiên đầu tư phát triển được Thủ tướng Chính\nphủ phê duyệt, doanh nghiệp công nghệ cao theo quy định của Luật công nghệ\ncao và các văn bản hướng dẫn Luật công nghệ cao.\n14.3. Phương thức áp dụng lãi suất:\na)\n\nLãi suất cho vay cố định trong suốt thời hạn cho vay;\n\nb)\n\nLãi suất cho vay có điều chỉnh.\n\n14.4. Nội dung thỏa thuận về lãi suất cho vay bao gồm mức lãi suất cho\nvay, phương thức áp dụng lãi suất và phương pháp tính lãi đối với khoản vay.\nTrường hợp mức lãi suất cho vay không quy đổi theo tỷ lệ %/năm và/hoặc không\náp dụng phương pháp tính lãi theo số dư nợ cho vay thực tế, thời gian duy trì số\ndư nợ gốc thực tế đó, thì trong thỏa thuận cho vay phải có nội dung về mức lãi\nsuất quy đổi theo tỷ lệ %/năm (một năm là ba trăm sáu mươi lăm ngày) tính theo\nsố dư nợ cho vay thực tế và thời gian duy trì số dư nợ cho vay thực tế đó.\n14.5. Khi đến hạn thanh toán mà khách hàng không trả hoặc trả không đầy\nđủ nợ gốc và/hoặc lãi tiền vay theo thỏa thuận, thì khách hàng phải trả lãi tiền vay\nnhư sau:\na)\nLãi trên nợ gốc theo lãi suất cho vay đã thỏa thuận tương ứng với\nthời hạn vay mà đến hạn chưa trả;\nb)\nTrường hợp hết thời hạn trả lãi khách hàng không trả đúng hạn tiền\nlãi theo quy định tại điểm a khoản này, thì phải trả lãi chậm trả theo mức lãi suất\ndo Đơn vị và khách hàng thỏa thuận nhưng không vượt quá 10%/năm tính trên số\ndư lãi chậm trả tương ứng với thời gian chậm trả;\n9\n\n\fc)\nTrường hợp khoản nợ vay bị chuyển nợ quá hạn, thì khách hàng phải\ntrả lãi trên dư nợ gốc bị quá hạn tương ứng với thời gian chậm trả, lãi suất áp\ndụng không vượt quá 150% lãi suất cho vay trong hạn tại thời điểm chuyển nợ\nquá hạn.\n14.6. Trường hợp áp dụng phương thức lãi suất cho vay có điều chỉnh,\nĐơn vị và khách hàng phải thỏa thuận nguyên tắc và các yếu tố để xác định lãi\nsuất điều chỉnh, thời điểm điều chỉnh lãi suất cho vay. Trường hợp căn cứ các yếu\ntố để xác định lãi suất điều chỉnh dẫn đến có nhiều mức lãi suất cho vay khác, thì\nĐơn vị áp dụng mức lãi suất cho vay thấp nhất.\nĐiều 15. Phí liên quan đến hoạt động cho vay\n15.1. Đơn vị và khách hàng thỏa thuận về việc thu các khoản phí liên quan\nđến hoạt động cho vay, gồm:\na)\n\nPhí trả nợ trước hạn trong trường hợp khách hàng trả nợ trước hạn.\n\nb)\n\nPhí trả cho hạn mức tín dụng dự phòng.\n\nc)\n\nPhí thu xếp cho vay hợp vốn.\n\nd)\nPhí cam kết rút vốn kể từ thời điểm thỏa thuận cho vay có hiệu lực\nđến ngày giải ngân vốn vay lần đầu.\ne)\nCác loại phí khác liên quan đến hoạt động cho vay được quy định cụ\nthể tại văn bản quy phạm pháp luật liên quan.\n15.2. Mức phí cụ thể được thực hiện theo quy định của Tổng Giám đốc\ntrong từng thời kỳ hoặc theo quy định tại từng sản phẩm.\nĐiều 16. Bảo đảm tiền vay\n16.1. Việc áp dụng biện pháp bảo đảm tiền vay hoặc không áp dụng biện\npháp bảo đảm tiền vay do Đơn vị và khách hàng thoả thuận. Việc thỏa thuận về\nbiện pháp bảo đảm tiền vay của Đơn vị với khách hàng phù hợp với quy định của\npháp luật, Chính sách bảo đảm tín dụng và các văn bản hướng dẫn kèm theo của\nVCB trong từng thời kỳ.\n16.2. Khách hàng, bên bảo đảm phải phối hợp với VCB để xử lý tài sản\nbảo đảm tiền vay khi có căn cứ xử lý theo thỏa thuận cho vay, hợp đồng bảo đảm\ntiền vay và quy định của pháp luật.\nĐiều 17. Cung cấp thông tin\n17.1. Đơn vị có trách nhiệm cung cấp cho khách hàng đầy đủ các thông\ntin trước khi xác lập thỏa thuận cho vay: Lãi suất cho vay; nguyên tắc và các yếu\ntố xác định, thời điểm xác định lãi suất cho vay đối với trường hợp áp dụng lãi\nsuất cho vay có điều chỉnh; lãi suất áp dụng đối với dư nợ gốc bị quá hạn; lãi suất\náp dụng đối với lãi chậm trả; phương pháp tính lãi tiền vay; loại phí và mức phí\n10\n\n\fáp dụng đối với khoản vay; các tiêu chí xác định khách hàng vay vốn theo lãi suất\ncho vay quy định tại khoản 14.2 Điều 14 Quy định này.\n17.2. Khách hàng cung cấp thông tin cho VCB và chịu trách nhiệm trước\npháp luật về tính chính xác, trung thực, đầy đủ của các tài liệu gửi cho VCB:\na)\n\nCác tài liệu quy định tại Điều 10 Quy định này;\n\nb)\nBáo cáo việc sử dụng vốn vay và chứng minh vốn vay được sử dụng\nđúng mục đích ghi trong thỏa thuận cho vay;\nc)\n\nCác tài liệu để chứng minh việc áp dụng biện pháp bảo đảm tiền vay.\n\nĐiều 18. Thẩm định và quyết định cho vay\n18.1. Đơn vị thẩm định khả năng đáp ứng các điều kiện vay vốn của\nkhách hàng theo quy định tại Điều 7 Quy định này để xem xét quyết định cho\nvay. Trong quá trình thẩm định, Đơn vị được sử dụng kết quả xếp hạng tín dụng\nnội bộ của VCB, kết hợp với các thông tin tại Trung tâm Thông tin tín dụng quốc\ngia Việt Nam, các kênh thông tin khác.\n18.2. Khi thẩm định và quyết định cho vay, ngoài các quy định tại Quy\nđịnh này, Đơn vị phải tuân thủ các quy định có liên quan khác của pháp luật và\nVCB (giới hạn tín dụng, khu vực đầu tư, phân cấp thẩm quyền phê duyệt tín\ndụng, quy trình tín dụng…). Việc thẩm định và phê duyệt cho vay phải đảm bảo\nnguyên tắc phân định trách nhiệm giữa khâu thẩm định và quyết định cho vay.\n18.3. Trường hợp quyết định không cho vay, Đơn vị thông báo bằng văn\nbản cho khách hàng lý do khi khách hàng có yêu cầu.\nĐiều 19. Trả nợ gốc và lãi tiền vay\n19.1. Căn cứ vào đặc điểm hoạt động kinh doanh (đối với nhu cầu vốn\nphục vụ hoạt động kinh doanh), khả năng tài chính và nguồn trả nợ của khách\nhàng, Đơn vị và khách hàng thỏa thuận về việc trả nợ gốc và lãi tiền vay như sau:\na)\nKỳ hạn trả nợ gốc: Đơn vị và khách hàng thỏa thuận trả nợ gốc theo\nmột kỳ hạn hoặc nhiều kỳ hạn; số tiền trả nợ và thời gian phân kỳ của mỗi kỳ hạn\ncó thể không bằng nhau.\nb)\nKỳ hạn trả lãi: Đơn vị và khách hàng có thể thỏa thuận kỳ hạn trả lãi\ntiền vay cùng với kỳ hạn trả nợ gốc; hoặc theo kỳ hạn riêng (hàng tháng, quý,…).\nc)\nTrường hợp tất toán khoản nợ thì khách hàng phải trả lãi tiền vay\ncùng ngày với ngày tất toán khoản nợ.\n19.2. Trả nợ trước hạn: VCB và khách hàng thỏa thuận về việc trả nợ\ntrước hạn. Trừ trường hợp VCB có quy định cụ thể về thu phí trả nợ trước hạn,\nĐơn vị và khách hàng thỏa thuận về việc áp dụng hoặc không áp dụng thu phí trả\nnợ trước hạn.\n11\n\n\f19.3. Trường hợp khách hàng không có khả năng trả nợ đúng hạn một\nphần hoặc toàn bộ nợ gốc và/hoặc lãi tiền vay, VCB xem xét chấp thuận cơ cấu\nlại thời hạn trả nợ theo quy định tại Điều 20 hoặc chuyển nợ quá hạn theo quy\nđịnh tại Điều 21 Quy định này. Đơn vị và khách hàng thỏa thuận việc tính lãi tiền\nvay phải trả phù hợp với quy định tại khoản 14.5 Điều 14 Quy định này.\n19.4. Thứ tự thu hồi nợ gốc, lãi tiền vay:\na)\nĐối với khoản nợ chưa bị quá hạn trả nợ: Tùy khả năng tài\nchính của khách hàng và khả năng tài chính của Đơn vị, Đơn vị xem xét và\nthỏa thuận với khách hàng về thứ tự thu hồi nợ gốc, lãi tiền vay và\ncác phí khác (nếu có).\nb)\nĐối với khoản nợ bị quá thời hạn trả nợ: Đơn vị thực hiện thu hồi nợ\ngốc, lãi tiền vay theo thứ tự nợ gốc thu trước, lãi tiền vay thu sau. Đối với khoản\nnợ vay có một hoặc một số kỳ hạn trả nợ bị quá hạn, Đơn vị thực hiện thu nợ theo\nthứ tự thu nợ gốc đã quá hạn, thu nợ lãi trên nợ gốc quá hạn chưa trả, thu nợ gốc\nđến hạn, thu nợ lãi trên nợ gốc mà đến hạn chưa trả.\nĐiều 20. Cơ cấu lại thời hạn trả nợ\n20.1. Trên cơ sở đề nghị của khách hàng, khả năng tài chính của VCB và\nkết quả đánh giá khả năng trả nợ của khách hàng, VCB xem xét và quyết định\nviệc cơ cấu lại thời hạn trả nợ như sau:\na)\nKhách hàng không có khả năng trả nợ đúng kỳ hạn nợ gốc và/hoặc\nlãi tiền vay và được VCB đánh giá là có khả năng trả đầy đủ nợ gốc và/hoặc lãi\ntiền vay theo kỳ hạn trả nợ được điều chỉnh, thì VCB xem xét điều chỉnh kỳ hạn\ntrả nợ gốc và/hoặc lãi tiền vay đó phù hợp với nguồn trả nợ của khách hàng; thời\nhạn cho vay không thay đổi.\nb)\nKhách hàng không có khả năng trả hết nợ gốc và/hoặc lãi tiền vay\nđúng thời hạn cho vay đã thỏa thuận và được VCB đánh giá là có khả năng trả\nđầy đủ nợ gốc và/hoặc lãi tiền vay trong một khoảng thời gian nhất định sau thời\nhạn cho vay, thì VCB xem xét cho gia hạn nợ với thời hạn phù hợp với nguồn trả\nnợ của khách hàng.\n20.2. Khi có nhu cầu cơ cấu lại thời hạn trả nợ, khách hàng phải gửi văn\nbản đề nghị cơ cấu lại thời hạn trả nợ kiêm phương án/kế hoạch trả nợ mới đến\nVCB.\n20.3. Việc VCB quyết định cơ cấu lại thời hạn trả nợ được thông báo hoặc\nthỏa thuận với khách hàng trước hoặc trong thời hạn 10 (mười) ngày kể từ ngày\nđến kỳ hạn, thời hạn trả nợ đã thỏa thuận.\n20.4. Thẩm quyền phê duyệt cơ cấu lại thời hạn trả nợ thực hiện theo quy\nđịnh về thẩm quyền phê duyệt tín dụng của VCB trong từng thời kỳ.\n12\n\n\f20.5. Quy trình và thủ tục cơ cấu lại thời hạn trả nợ thực hiện theo quy\nđịnh tại quy trình tín dụng do Tổng Giám đốc ban hành trong từng thời kỳ.\nĐiều 21. Nợ quá hạn\n21.1. Đơn vị chuyển nợ quá hạn đối với số dư nợ gốc mà khách hàng\nkhông trả được nợ đúng hạn theo thỏa thuận và không được VCB chấp thuận cơ\ncấu lại thời hạn trả nợ.\n21.2. Đơn vị thông báo cho khách hàng về việc chuyển nợ quá hạn. Nội\ndung thông báo tối thiểu bao gồm số dư nợ gốc bị quá hạn, thời điểm chuyển nợ\nquá hạn, lãi suất áp dụng đối với dư nợ gốc bị quá hạn và lãi phạt chậm trả áp\ndụng đối với lãi tiền vay không trả đúng hạn (nếu có). Thông báo chuyển nợ quá\nhạn được gửi đến khách hàng thông qua hình thức sau:\na)\n\nBằng văn bản đối với khách hàng là pháp nhân.\n\nb)\nBằng văn bản hoặc các hình thức khác có giá trị tương đương văn\nbản đối với khách hàng là cá nhân.\nĐiều 22. Chấm dứt cho vay, xử lý nợ, miễn, giảm lãi tiền vay, phí\n22.1. Chấm dứt cho vay, thu hồi nợ trước hạn:\na)\nVCB có quyền chấm dứt cho vay, thu hồi nợ trước hạn theo nội\ndung đã thỏa thuận trong thỏa thuận cho vay khi phát hiện khách hàng cung cấp\nthông tin sai sự thật, vi phạm quy định trong thỏa thuận cho vay và/hoặc hợp\nđồng bảo đảm tiền vay.\nb)\nTrước khi thực hiện chấm dứt cho vay, thu hồi nợ trước hạn theo thỏa\nthuận trong thỏa thuận cho vay, Đơn vị phải thông báo bằng văn bản cho khách\nhàng về việc chấm dứt cho vay, thu hồi nợ trước hạn. Nội dung thông báo tối thiểu\nbao gồm thời điểm chấm dứt cho vay, thu hồi nợ trước hạn, số dư nợ gốc bị thu hồi\ntrước hạn; thời hạn hoàn trả số dư nợ gốc bị thu hồi trước hạn, thời điểm chuyển\nnợ quá hạn và lãi suất áp dụng đối với số dư nợ gốc bị thu hồi trước hạn.\n22.2. Xử lý nợ:\na)\nTrường hợp khách hàng không trả được nợ đến hạn, Đơn vị áp dụng\ncác biện pháp thu hồi nợ theo quy định tại thỏa thuận cho vay, hợp đồng bảo\nđảm, quy định của pháp luật có liên quan và quy định của VCB.\nb)\nTrường hợp sau khi áp dụng các biện pháp thu hồi nợ nhưng vẫn\nkhông đủ để hoàn thành nghĩa vụ trả nợ đối với VCB, thì khách hàng có trách\nnhiệm tiếp tục trả đầy đủ nợ gốc và lãi tiền vay cho VCB.\nc)\nTrường hợp khách hàng hoặc bên bảo đảm bị tòa án quyết định mở\nthủ tục phá sản hoặc tuyên bố phá sản, thì việc thu hồi nợ của VCB đối với khách\nhàng, bên bảo đảm thực hiện theo quy định của pháp luật về phá sản.\n13\n\n\f22.3. Đơn vị thực hiện miễn, giảm lãi tiền vay, phí cho khách hàng theo quy\nđịnh của VCB về miễn, giảm lãi tiền vay, phí cho khách hàng trong từng thời kỳ.\nĐiều 23. Thỏa thuận cho vay\n23.1. Đơn vị và khách hàng xác lập, ký kết và thực hiện thỏa thuận cho\nvay phù hợp với Quy định này, quyết định cho vay của cấp có thẩm quyền và các\nquy định có liên quan của pháp luật.\n23.2. Thỏa thuận cho vay phải được lập thành văn bản, trong đó tối thiểu\ncó các nội dung sau:\na)\nTên, địa chỉ, mã số doanh nghiệp của Đơn vị; tên, địa chỉ, số chứng\nminh nhân dân hoặc thẻ căn cước hoặc hộ chiếu hoặc mã số doanh nghiệp của\nkhách hàng;\nb)\nSố tiền cho vay; hạn mức cho vay đối với trường hợp cho vay theo\nhạn mức; hạn mức cho vay dự phòng đối với trường hợp cho vay theo hạn mức\ncho vay dự phòng; hạn mức thấu chi đối với trường hợp cho vay theo hạn mức\nthấu chi trên tài khoản thanh toán;\nc)\n\nMục đích sử dụng vốn vay;\n\nd)\n\nĐồng tiền cho vay, đồng tiền trả nợ;\n\ne)\n\nPhương thức cho vay;\n\nf)\nThời hạn cho vay; thời hạn duy trì hạn mức đối với trường hợp cho\nvay theo hạn mức, thời hạn hiệu lực của hạn mức cho vay dự phòng đối với\ntrường hợp cho vay theo hạn mức cho vay dự phòng, hoặc thời hạn duy trì hạn\nmức thấu chi đối với trường hợp cho vay theo hạn mức thấu chi trên tài khoản\nthanh toán;\ng)\nLãi suất cho vay theo thỏa thuận và mức lãi suất quy đổi theo tỷ lệ\n%/năm tính theo số dư nợ cho vay thực tế và thời gian duy trì số dư nợ cho vay\nthực tế đó theo quy định tại khoản 14.4 Điều 14 Quy định này; nguyên tắc và các\nyếu tố xác định lãi suất, thời điểm xác định lãi suất cho vay đối với trường hợp áp\ndụng lãi suất cho vay có điều chỉnh; lãi suất áp dụng đối với dư nợ gốc bị quá\nhạn; thời hạn trả lãi; lãi suất áp dụng đối với lãi chậm trả; loại phí liên quan đến\nkhoản vay và mức phí áp dụng;\nh)\nGiải ngân vốn cho vay và việc sử dụng phương tiện thanh toán để\ngiải ngân vốn cho vay;\ni)\nViệc trả nợ gốc, lãi tiền vay và thứ tự thu hồi nợ gốc, lãi tiền vay; trả\nnợ trước hạn;\nj)\nCơ cấu lại thời hạn trả nợ; điều kiện cơ cấu lại thời hạn trả nợ;\nchuyển nợ quá hạn đối với số dư nợ gốc mà khách hàng không trả được nợ đúng\n14\n\n\fhạn theo thỏa thuận và không được VCB chấp thuận cơ cấu lại thời hạn trả nợ;\nhình thức và nội dung thông báo chuyển nợ quá hạn theo quy định tại khoản 21.2\nĐiều 21 Quy định này;\nk)\n\nBiện pháp bảo đảm tiền vay;\n\nl)\nTrách nhiệm của khách hàng trong việc phối hợp với VCB và cung\ncấp các tài liệu liên quan đến khoản vay để VCB thực hiện thẩm định và quyết\nđịnh cho vay, kiểm tra, giám sát việc sử dụng vốn vay và trả nợ của khách hàng;\nm)\nCác trường hợp chấm dứt cho vay; thu nợ trước hạn; chuyển nợ quá\nhạn đối với số dư nợ gốc mà khách hàng không trả được nợ trước hạn khi VCB\nchấm dứt cho vay, thu hồi nợ trước hạn; hình thức và nội dung thông báo chấm\ndứt cho vay, thu hồi nợ trước hạn theo theo quy định tại điểm b khoản 22.1 Điều\n22 Quy định này;\nn)\nXử lý nợ vay; phạt vi phạm và bồi thường thiệt hại; quyền và trách\nnhiệm của các bên;\no)\n\nHiệu lực của thỏa thuận cho vay.\n\n23.3. Ngoài các nội dung bắt buộc theo quy định tại khoản 23.2 Điều này,\nĐơn vị và khách hàng có thể thỏa thuận các nội dung khác với điều kiện các nội\ndung đó phải phù hợp với quy định của pháp luật, quy định nội bộ của VCB và\nđảm bảo tối đa quyền lợi của VCB.\n23.4. Hình thức của thỏa thuận cho vay:\na)\nThỏa thuận cho vay được lập dưới hình thức thỏa thuận cho vay cụ\nthể hoặc thỏa thuận khung và thỏa thuận cho vay cụ thể. Thỏa thuận cho vay có\nthể có phụ lục kèm theo để quy định chi tiết một số điều khoản của thỏa thuận\ncho vay; phụ lục thỏa thuận cho vay là một bộ phận không tách rời của thỏa\nthuận cho vay, có hiệu lực như thỏa thuận cho vay; nội dung của phụ lục thỏa\nthuận cho vay không được trái với nội dung của thỏa thuận cho vay.\nb)\nViệc sửa đổi, bổ sung thỏa thuận cho vay phải được lập thành văn\nbản. Văn bản sửa đổi, bổ sung thỏa thuận cho vay là một bộ phận không tách rời\ncủa thỏa thuận cho vay.\nc)\nTrường hợp sử dụng hợp đồng, thỏa thuận cho vay theo mẫu hoặc\nđiều kiện giao dịch chung về cho vay trong giao kết thỏa thuận cho vay, Đơn vị\ncung cấp đầy đủ thông tin về hợp đồng theo mẫu, điều kiện giao dịch chung cho\nkhách hàng biết trước khi giao kết thỏa thuận cho vay và yêu cầu khách hàng xác\nnhận về việc đã được VCB cung cấp đầy đủ thông tin trước khi ký kết thỏa thuận\ncho vay. Việc xác nhận của khách hàng được thực hiện theo văn bản riêng\nvà/hoặc được ghi trong thỏa thuận cho vay.\n15\n\n\f23.5. VCB thực hiện việc niêm yết công khai thỏa thuận cho vay theo mẫu,\nđiều kiện giao dịch chung về cho vay tại trụ sở các Đơn vị và đăng tải trên trang\nthông tin điện tử của VCB.\n23.6. Thẩm quyền ký thỏa thuận cho vay:\na)\nNếu khách hàng vay vốn là pháp nhân, thỏa thuận cho vay phải được\nký bởi người đại diện theo pháp luật của pháp nhân hoặc người được người đại\ndiện theo pháp luật của pháp nhân ủy quyền hợp pháp bằng văn bản. Người đại\ndiện theo ủy quyền của khách hàng chỉ được ký thỏa thuận cho vay theo nội\ndung, phạm vi, thời hạn ủy quyền ghi trong văn bản ủy quyền phù hợp với quy\nđịnh của pháp luật.\nb)\nNếu khách hàng vay vốn là cá nhân, thỏa thuận cho vay phải được\nxác lập, thực hiện bởi chính cá nhân vay vốn đó. Trường hợp cá nhân là thành\nviên của hộ kinh doanh, doanh nghiệp tư nhân, hộ gia đình, tổ hợp tác và tổ chức\nkhác không có tư cách pháp nhân vay vốn để đáp ứng nhu cầu vốn của hộ kinh\ndoanh, doanh nghiệp tư nhân, hộ gia đình, tổ hợp tác, tổ chức khác không có tư\ncách pháp nhân, thì (các) thành viên của hộ kinh doanh, doanh nghiệp tư nhân, hộ\ngia đình, tổ hợp tác, tổ chức khác không có tư cách pháp nhân phải xác lập, ký\nkết, thực hiện thỏa thuận cho vay hoặc ủy quyền cho người đại diện tham gia xác\nlập, ký kết, thực hiện thỏa thuận cho vay. Việc ủy quyền phải được lập thành văn\nbản và được công chứng phù hợp với quy định của pháp luật.\nc)\nVề phía Đơn vị, thẩm quyền ký thỏa thuận cho vay thực hiện theo\nquy định của VCB về ủy quyền ký kết hợp đồng kinh doanh, thương mại, dân sự\ntrong từng thời kỳ.\nĐiều 24. Biểu mẫu áp dụng khi cho vay\n24.1. Tổng Giám đốc ban hành thỏa thuận cho vay theo mẫu và các biểu\nmẫu có liên quan để thực hiện việc cho vay đối với khách hàng, phù hợp với quy\nđịnh tại Quy định này và quy định của pháp luật.\n24.2. Trong quá trình cho vay, Đơn vị sử dụng thống nhất thỏa thuận cho\nvay theo mẫu và các biểu mẫu có liên quan do Tổng Giám đốc ban hành trong từng\nthời kỳ phù hợp với thực tế giao dịch, công việc cụ thể phát sinh và phù hợp với\ncác quy định của pháp luật. Việc thuê tổ chức hành nghề luật sư rà soát, tư vấn về\nthỏa thuận cho vay khi xác lập, ký kết, thực hiện giao dịch với khách hàng thực\nhiện theo hướng dẫn của Tổng Giám đốc trong từng thời kỳ.\n24.3. Việc sửa đổi, bổ sung, chấm dứt hoặc hủy bỏ thỏa thuận cho vay\ntheo mẫu và các biểu mẫu phải phù hợp với quy định của pháp luật và quy định\ncủa VCB.\n16\n\n\fĐiều 25. Kiểm tra sử dụng tiền vay\n25.1. Khách hàng có trách nhiệm sử dụng vốn vay và trả nợ theo nội dung\nthỏa thuận; báo cáo bằng văn bản và cung cấp tài liệu chứng minh việc sử dụng\nvốn vay theo yêu cầu của VCB.\n25.2. VCB có quyền, nghĩa vụ kiểm tra, giám sát việc sử dụng vốn vay và\ntrả nợ của khách hàng theo quy định của pháp luật và quy trình tín dụng, sản\nphẩm, văn bản có liên quan của VCB trong từng thời kỳ.\nĐiều 26. Phạt vi phạm và bồi thường thiệt hại\n26.1. Đơn vị và khách hàng có thể thỏa thuận về việc phạt vi phạm, bồi\nthường thiệt hại theo quy định của pháp luật đối với trường hợp một trong các\nbên không thực hiện và/hoặc thực hiện không đúng nội dung trong thỏa thuận cho\nvay, trừ trường hợp quy định tại khoản 14.5 Điều 14 Quy định này.\n26.2. Trường hợp Đơn vị và khách hàng có thỏa thuận về việc phạt vi\nphạm và/hoặc bồi thường thiệt hại thì nội dung đó phải được quy định cụ thể\ntrong thỏa thuận cho vay và các văn bản thỏa thuận khác (nếu có), tối thiểu bao\ngồm các trường hợp vi phạm mà các bên sẽ bị phạt và/hoặc phải bồi thường thiệt\nhại; mức phạt vi phạm và/hoặc mức bồi thường thiệt hại.\nĐiều 27. Các quy định khác\nKhi thực hiện cho vay, Đơn vị có trách nhiệm:\n27.1. Tuân thủ các quy định về những trường hợp không được cho vay,\nhạn chế cho vay và giới hạn cho vay tại Điều 126, Điều 127, Điều 128 Luật Các\ntổ chức tín dụng, quy định của NHNN về các giới hạn, tỷ lệ bảo đảm an toàn\ntrong hoạt động của TCTD và các văn bản hướng dẫn của VCB.\n27.2. Sử dụng các phương tiện thanh toán để giải ngân vốn cho vay theo\nquy định của NHNN về phương thức giải ngân vốn cho vay của TCTD đối với\nkhách hàng và các văn bản hướng dẫn của VCB.\n27.3. Thực hiện việc phân loại, trích lập dự phòng và sử dụng dự phòng để\nxử lý rủi ro đối với hoạt động cho vay theo quy định của NHNN về phân loại tài sản\ncó, mức trích, phương pháp trích lập dự phòng rủi ro và việc sử dụng dự phòng để\nxử lý rủi ro trong hoạt động của TCTD và các văn bản hướng dẫn của VCB.\n27.4. Thực hiện việc hạch toán kế toán, báo cáo thống kê đối với hoạt\nđộng cho vay theo quy định của pháp luật hiện hành về chế độ hạch toán kế toán\nvà báo cáo thống kê của TCTD và các văn bản hướng dẫn của VCB.\n\n17\n\n\fCHƯƠNG II\n\nQUY ĐỊNH CỤ THỂ\nMỤC 1\nHOẠT ĐỘNG CHO VAY PHỤC VỤ HOẠT ĐỘNG KINH DOANH\nĐiều 28. Phương thức cho vay\nĐơn vị thỏa thuận với khách hàng việc áp dụng các phương thức cho vay\nsau đây:\n28.1. Cho vay từng lần: Mỗi lần cho vay, Đơn vị và khách hàng thực hiện\nthủ tục cho vay và giao kết thỏa thuận cho vay. Tổng số tiền rút vốn tối đa bằng\nsố tiền cho vay cam kết trong thỏa thuận cho vay.\n28.2. Cho vay hợp vốn: Đơn vị cùng một hoặc một số TCTD khác thực\nhiện cho vay đối với khách hàng để thực hiện một phương án, dự án vay vốn.\nViệc cho vay hợp vốn thực hiện theo quy định của pháp luật có liên quan và quy\nđịnh của VCB trong từng thời kỳ.\n28.3. Cho vay lưu vụ: Là việc Đơn vị thực hiện cho vay đối với khách\nhàng để nuôi trồng, chăm sóc các cây trồng, vật nuôi có tính chất mùa vụ theo\nchu kỳ sản xuất liền kề trong năm hoặc các cây lưu gốc, cây công nghiệp có thu\nhoạch hàng năm. Theo đó, Đơn vị và khách hàng thỏa thuận dư nợ gốc của chu\nkỳ trước tiếp tục được sử dụng cho chu kỳ sản xuất tiếp theo nhưng không vượt\nquá thời gian của 02 (hai) chu kỳ sản xuất liên tiếp. Việc cho vay lưu vụ thực\nhiện theo quy định tại sản phẩm và/hoặc hướng dẫn của VCB trong từng\nthời kỳ.\n28.4. Cho vay theo hạn mức: Đơn vị xác định và thỏa thuận với khách\nhàng hạn mức cho vay tối đa duy trì trong một khoảng thời gian nhất định. Một\nnăm ít nhất một lần, Đơn vị xem xét xác định lại hạn mức cho vay tối đa và thời\ngian duy trì hạn mức này.\n28.5. Cho vay theo hạn mức cho vay dự phòng: Đơn vị cam kết đảm bảo\nsẵn sàng cho khách hàng vay vốn trong phạm vi mức cho vay dự phòng đã thỏa\nthuận (ngoài phạm vi hạn mức cho vay đã thỏa thuận). Đơn vị và khách hàng\nthỏa thuận thời hạn hiệu lực của hạn mức cho vay dự phòng nhưng không vượt\nquá 01 (một) năm.\n28.6. Cho vay theo hạn mức thấu chi trên tài khoản thanh toán: Đơn vị\nchấp thuận cho khách hàng chi vượt số tiền có trên tài khoản thanh toán của\nkhách hàng một mức thấu chi tối đa để thực hiện dịch vụ thanh toán trên tài\nkhoản thanh toán. Mức thấu chi tối đa được duy trì trong một khoảng thời gian\n18\n\n\ftối đa 01 (một) năm. Việc cho vay theo hạn mức thấu chi thực hiện theo quy định\ntại sản phẩm của VCB trong từng thời kỳ.\n28.7. Cho vay quay vòng: Đơn vị và khách hàng thỏa thuận áp dụng cho\nvay đối với nhu cầu vốn có chu kỳ hoạt động kinh doanh không quá 01 (một)\ntháng, khách hàng được sử dụng dư nợ gốc của chu kỳ hoạt động kinh doanh\ntrước cho chu kỳ kinh doanh tiếp theo nhưng thời hạn cho vay không vượt quá 03\n(ba) tháng. Việc cho vay quay vòng thực hiện theo quy định tại sản phẩm \ncủa VCB trong từng thời kỳ.\n28.8. Cho vay tuần hoàn (rollover): Đơn vị và khách hàng thỏa thuận áp\ndụng cho vay ngắn hạn đối với khách hàng với điều kiện:\na)\nĐến thời hạn trả nợ, khách hàng có quyền trả nợ hoặc kéo dài thời\nhạn trả nợ thêm một khoảng thời gian nhất định đối với một phần hoặc toàn bộ số\ndư nợ gốc của khoản vay;\nb)\nTổng thời hạn vay vốn không vượt quá 12 tháng kể từ ngày giải\nngân ban đầu và không vượt quá một chu kỳ hoạt động kinh doanh;\nc)\nTại thời điểm xem xét cho vay, khách hàng không có nợ xấu tại\nVCB và/hoặc các TCTD khác;\nd)\nTrong quá trình cho vay tuần hoàn, nếu khách hàng có nợ xấu tại\nVCB và/hoặc các TCTD khác thì không được thực hiện kéo dài thời hạn trả nợ\ntheo thỏa thuận.\ne)\nViệc cho vay tuần hoàn thực hiện theo quy định tại sản phẩm chuẩn\ncủa VCB trong từng thời kỳ.\n28.9. Các phương thức cho vay khác được kết hợp các phương thức cho\nvay quy định tại khoản 28.1, 28.2, 28.3, 28.4, 28.5, 28.6, 28.7 và 28.8 Điều này,\nphù hợp với điều kiện hoạt động kinh doanh của VCB, đặc điểm của khách hàng\nvay và đặc điểm của khoản vay.\nĐiều 29. Thời hạn cho vay\n29.1. Đơn vị và khách hàng căn cứ vào chu kỳ hoạt động kinh doanh, thời\nhạn thu hồi vốn, khả năng trả nợ của khách hàng, nguồn vốn cho vay và thời hạn\nhoạt động còn lại của VCB để thoả thuận về thời hạn cho vay.\n29.2. Đối với khách hàng là pháp nhân được thành lập và hoạt động tại\nViệt Nam, pháp nhân được thành lập ở nước ngoài và hoạt động hợp pháp tại\nViệt Nam, thời hạn cho vay không quá thời hạn hoạt động hợp pháp còn lại của\nkhách hàng.\n29.3. Đối với khách hàng là cá nhân có quốc tịch nước ngoài cư trú tại\nViệt Nam, thời hạn cho vay không vượt quá thời hạn được phép cư trú còn lại tại\n19\n\n\fViệt Nam. Trường hợp khách hàng vay vốn là từ 02 (hai) cá nhân trở lên và bao\ngồm cá nhân có quốc tịch nước ngoài thì thời hạn cho vay tối đa không vượt quá\nthời hạn còn lại ngắn nhất được phép cư trú tại Việt Nam của các cá nhân đó.\n29.4. Trường hợp khách hàng vay vốn là cá nhân mà vợ và/hoặc chồng có\nquốc tịch nước ngoài và đang cư trú lại Việt Nam, thì thời hạn cho vay tối đa\nkhông vượt quá thời hạn còn lại ngắn nhất được phép cư trú tại Việt Nam của cả\nvợ và chồng. Trường hợp thời hạn cho vay của khách hàng cá nhân không đáp\nứng quy định tại khoản này, Đơn vị thực hiện theo hướng dẫn của Tổng Giám\nđốc hoặc theo quy định sản phẩm.\nĐiều 30. Lưu giữ hồ sơ cho vay\n30.1. Đơn vị lập hồ sơ cho vay, bao gồm:\na)\n\nHồ sơ đề nghị vay vốn theo quy định tại Điều 10 Quy định này;\n\nb)\n\nThỏa thuận cho vay;\n\nc)\nBáo cáo thực trạng tài chính do khách hàng gửi VCB trong thời gian\nvay vốn: Báo cáo tài chính nộp cho cơ quan nhà nước có thẩm quyền và/hoặc báo\ncáo tài chính đã kiểm toán đối với trường hợp khách hàng phải lập báo cáo tài\nchính theo quy định của pháp luật; báo cáo tình hình tài chính của khách hàng\ntheo hướng dẫn của VCB.\nd)\n\nHồ sơ liên quan đến bảo đảm tiền vay;\n\ne)\nQuyết định cho vay có chữ ký của người có thẩm quyền; trường hợp\nquyết định tập thể, phải có biên bản ghi rõ quyết định được thông qua;\nf)\nNhững tài liệu phát sinh trong quá trình sử dụng khoản vay liên quan\nđến thỏa thuận cho vay do VCB hướng dẫn trong từng thời kỳ.\n30.2. Đơn vị phải lưu giữ hồ sơ cho vay; thời hạn lưu giữ hồ sơ cho vay\nthực hiện theo quy định của pháp luật liên quan và quy định của VCB.\nMỤC 2\nHOẠT ĐỘNG CHO VAY PHỤC VỤ NHU CẦU ĐỜI SỐNG\nĐiều 31. Phương thức cho vay\nĐơn vị thoả thuận với khách hàng việc áp dụng các phương thức cho vay\nsau đây:\n31.1. Phương thức cho vay theo quy định tại khoản 28.1, 28.4 và 28.6\nĐiều 28 Quy định này.\n20\n\n\f31.2. Các phương thức cho vay khác được kết hợp các phương thức cho\nvay quy định tại khoản 31.1 Điều này, phù hợp với điều kiện hoạt động kinh\ndoanh của VCB, đặc điểm của khách hàng vay và đặc điểm của khoản vay.\nĐiều 32. Thời hạn cho vay\n32.1. Đơn vị và khách hàng thỏa thuận về thời hạn cho vay trên cơ sở khả\nnăng trả nợ của khách hàng, nguồn vốn cho vay và thời hạn hoạt động còn lại của\nVCB.\n32.2. Đối với cá nhân có quốc tịch nước ngoài cư trú tại Việt Nam, thời\nhạn cho vay không vượt quá thời hạn được phép cư trú còn lại tại Việt Nam.\nTrường hợp khách hàng vay vốn là từ 02 (hai) cá nhân trở lên và bao gồm cá\nnhân có quốc tịch nước ngoài thì thời hạn cho vay tối đa không vượt quá thời hạn\nđược phép cư trú ngắn nhất còn lại tại Việt Nam của các cá nhân đó.\n32.3. Trường hợp khách hàng vay vốn là cá nhân mà vợ và/hoặc chồng có\nquốc tịch nước ngoài và đang cư trú tại Việt Nam, thì thời hạn cho vay tối đa\nkhông vượt quá thời hạn còn lại ngắn nhất được phép cư trú tại Việt Nam của cả\nvợ và chồng. Trường hợp thời hạn cho vay của khách hàng cá nhân không đáp\nứng quy định tại khoản này, Đơn vị thực hiện theo hướng dẫn của Tổng Giám\nđốc hoặc theo quy định sản phẩm..\nĐiều 33. Lưu giữ hồ sơ cho vay\n33.1. Đơn vị lập hồ sơ cho vay, bao gồm:\na)\n\nHồ sơ đề nghị vay vốn theo quy định tại Điều 10 Quy định này;\n\nb)\n\nThỏa thuận cho vay;\n\nc)\nBáo cáo tình hình thu nhập của khách hàng trong thời gian vay vốn\ntheo hướng dẫn của VCB;\nd)\n\nHồ sơ liên quan đến bảo đảm tiền vay;\n\ne)\nQuyết định cho vay có chữ ký của người có thẩm quyền; trường hợp\nquyết định tập thể, phải có biên bản ghi rõ quyết định được thông qua;\nf)\nNhững tài liệu phát sinh trong quá trình sử dụng khoản vay liên quan\nđến thỏa thuận cho vay do VCB hướng dẫn trong từng thời kỳ.\n33.2. Đơn vị phải lưu giữ hồ sơ cho vay; thời hạn lưu giữ hồ sơ cho vay\nthực hiện theo quy định của pháp luật liên quan và quy định của VCB.\n\n21\n\n\fMỤC 3\nHOẠT ĐỘNG CHO VAY BẰNG PHƯƠNG TIỆN ĐIỆN TỬ\nĐiều 33a. Nguyên tắc cho vay bằng phương tiện điện tử\n33a.1. Việc cho vay bằng phương tiện điện tử thực hiện theo quy định sản\nphẩm của VCB. Thẩm quyền phê duyệt sản phẩm thực hiện theo quy định hiện\nhành của VCB trong từng thời kỳ. Đối với sản phẩm quy định một trong các khâu\nthẩm định, phê duyệt và quyết định cho vay thực hiện hoàn toàn bằng phương tiện\nđiện tử nhưng sản phẩm đó không thuộc thẩm quyền phê duyệt của HĐQT, Tổng\nGiám đốc trình HĐQT thông qua chủ trương trước khi ban hành.\n33a.2. Việc thực hiện cho vay bằng phương tiện điện tử phù hợp với điều\nkiện hoạt động kinh doanh của VCB, đặc điểm của khoản vay, đảm bảo an ninh,\nan toàn, bảo vệ thông điệp dữ liệu và bảo mật thông tin phù hợp với quy định của\npháp luật về phòng, chống rửa tiền, giao dịch điện tử, hướng dẫn của NHNN về\nquản lý rủi ro và các văn bản pháp luật có liên quan.\n33a.3. Hệ thống thông tin thực hiện hoạt động cho vay bằng phương tiện\nđiện tử phải tuân thủ quy định về bảo đảm an toàn hệ thống thông tin cấp độ 3 trở\nlên theo quy định của Chính phủ về bảo đảm an toàn hệ thống thông tin theo cấp\nđộ và quy định của Ngân hàng Nhà nước Việt Nam về an toàn hệ thống thông tin\ntrong hoạt động ngân hàng.\n33a.4. Việc lưu trữ, bảo quản thông tin, dữ liệu thực hiện theo quy định của\npháp luật, đảm bảo an toàn, bảo mật và được sao lưu dự phòng đảm bảo tính đầy\nđủ, toàn vẹn của hồ sơ cho phép truy cập, sử dụng khi cần thiết hoặc để phục vụ\ncông tác kiểm tra, đối chiếu, giải quyết tra soát, khiếu nại, tranh chấp và cung cấp\nthông tin khi có yêu cầu từ cơ quan quản lý nhà nước có thẩm quyền.\n33a.5. VCB tự quyết định biện pháp, hình thức, công nghệ phục vụ hoạt\nđộng cho vay bằng phương tiện điện tử, tự chịu rủi ro phát sinh (nếu có) và phải\nđáp ứng tối thiểu các yêu cầu sau:\na)\nCó giải pháp, công nghệ kỹ thuật đảm bảo tính chính xác, bảo mật,\nan toàn trong quá trình thu thập, sử dụng, kiểm tra thông tin, dữ liệu;\nb)\nCó biện pháp kiểm tra, đối chiếu, cập nhật, xác minh thông tin, dữ\nliệu; có biện pháp ngăn chặn các hành vi giả mạo, can thiệp, chỉnh sửa làm sai\nlệch thông tin, dữ liệu;\nc)\nCó biện pháp theo dõi, nhận dạng, đo lường và kiểm soát rủi ro; có\nphương án xử lý rủi ro;\nd)\nPhân công trách nhiệm cụ thể từng cá nhân, bộ phận có liên quan\ntrong hoạt động cho vay bằng phương tiện điện tử và trong việc quản lý, giám sát\nrủi ro.\n22\n\n\f33a.6. Việc xem xét, quyết định thực hiện hoạt động cho vay bằng phương\ntiện điện tử theo quy định tại Mục 3 Quyết định này. Các nội dung không được\nquy định tại Mục 3 Quyết định này thực hiện theo các quy định liên quan tại\nQuyết định này.\nĐiều 33b. Nhận biết, xác minh thông tin nhận biết khách hàng\n33b.1. VCB phải có giải pháp, công nghệ kỹ thuật để nhận biết và xác\nminh thông tin nhận biết khách hàng phục vụ hoạt động cho vay bằng phương\ntiện điện tử; chịu trách nhiệm về rủi ro phát sinh (nếu có) và phải đảm bảo tối\nthiểu các yêu cầu sau:\na)\nĐảm bảo sự khớp đúng giữa thông tin nhận biết khách hàng, dữ liệu\nsinh trắc học của khách hàng (là các yếu tố, đặc điểm sinh học gắn liền với khách\nhàng thực hiện định danh, khó làm giả, có tỷ lệ trùng nhau thấp như vân tay,\nkhuôn mặt, mống mắt, giọng nói và các yếu tố sinh trắc học khác) với các thông\ntin, yếu tố sinh trắc học tương ứng trên các tài liệu, dữ liệu cần thiết nhằm nhận\nbiết khách hàng theo quy định của pháp luật về phòng, chống rửa tiền, theo yêu\ncầu của tổ chức tín dụng hoặc với dữ liệu định danh cá nhân được xác thực bởi cơ\nquan nhà nước có thẩm quyền hoặc với cơ sở dữ liệu căn cước công dân, cơ sở\ndữ liệu quốc gia về dân cư hoặc bởi tổ chức cung cấp dịch vụ xác thực điện tử\ntheo quy định của pháp luật về định danh và xác thực điện tử hoặc bởi tổ chức tín\ndụng khác;\nb)\nXây dựng quy trình quản lý, kiểm soát, đánh giá rủi ro, trong đó có\nbiện pháp ngăn chặn các hành vi mạo danh, can thiệp, chỉnh sửa, làm sai lệch\nthông tin nhận biết khách hàng trong quá trình cho vay; có biện pháp để kiểm tra,\nxác minh thông tin nhận biết khách hàng đảm bảo khách hàng thực hiện giao dịch\nbằng phương tiện điện tử là khách hàng vay vốn; có biện pháp kỹ thuật để xác\nnhận khách hàng đã được định danh đồng ý với thỏa thuận cho vay. Quy trình\nquản lý, kiểm soát rủi ro phải thường xuyên được rà soát, hoàn thiện dựa trên\nnhững thông tin, dữ liệu cập nhật;\nc)\nLưu trữ, bảo quản đầy đủ, chi tiết thông tin nhận biết khách hàng, dữ\nliệu sinh trắc học của khách hàng; âm thanh, hình ảnh, bản ghi hình, ghi âm; số\nđiện thoại thực hiện giao dịch; nhật ký giao dịch trong quá trình cho vay.\n33b.2. Việc nhận biết, xác minh thông tin nhận biết khách hàng tại Khoản\n33b.1 Điều này áp dụng đối với khách hàng là cá nhân vay vốn phục vụ nhu cầu\nđời sống, lần đầu thiết lập mối quan hệ tại VCB. Trường hợp khách hàng là cá\nnhân vay vốn phục vụ nhu cầu đời sống, đã thiết lập mối quan hệ tại VCB và\nhoàn thành việc nhận biết, xác minh thông tin nhận biết khách hàng, VCB được\nquyết định việc áp dụng các biện pháp, hình thức, công nghệ để xác minh thông\n23\n\n\ftin nhận biết khách hàng phục vụ cho vay bằng phương tiện điện tử đảm bảo phù\nhợp với các thông tin đã biết về khách hàng.\nĐiều 33c. Dư nợ cho vay\nDư nợ cho vay tại VCB đối với một khách hàng là cá nhân vay vốn phục\nvụ nhu cầu đời sống và được nhận biết, xác minh thông tin nhận biết khách hàng\ntheo quy định tại Điều 33b Quyết định này không vượt quá 100.000.000 (một\ntrăm triệu) đồng Việt Nam.\nĐiều 33d. Hồ sơ đề nghị vay vốn\nKhi có nhu cầu vay vốn, khách hàng phải gửi cho VCB các tài liệu, dữ liệu\nchứng minh đủ điều kiện vay vốn theo quy định tại Điều 7 Quyết định này và các\ntài liệu, dữ liệu khác theo hướng dẫn của VCB.\nĐiều 33đ. Thẩm định và quyết định cho vay\nViệc tổ chức xét duyệt cho vay bằng phương tiện điện tử phải đảm bảo\nnguyên tắc phân định trách nhiệm của từng cá nhân, bộ phận xây dựng, thiết lập\nvà vận hành hệ thống thông tin phục vụ khâu thẩm định và quyết định cho vay.\nTrường hợp có rủi ro phát sinh, VCB phải có cơ chế để xác định từng cá nhân, bộ\nphận chịu trách nhiệm và xử lý kịp thời các vấn đề, rủi ro phát sinh để đảm bảo\nhiệu quả, an toàn trong việc tổ chức xét duyệt cho vay bằng phương tiện điện tử\ncủa tổ chức tín dụng.\nĐiều 33e. Thỏa thuận cho vay\nThỏa thuận cho vay được lập thành văn bản, trường hợp là hợp đồng điện\ntử thực hiện theo quy định của pháp luật về giao dịch điện tử và phải có tối thiểu\ncác nội dung quy định tại Điều 23 Quyết định này.\nĐiều 33g. Lưu giữ hồ sơ cho vay\n33g.1. VCB lập hồ sơ cho vay dưới dạng thông điệp dữ liệu phù hợp với\nquy định của pháp luật về lưu trữ, pháp luật về giao dịch điện tử và pháp luật có\nliên quan, bao gồm:\na)\n\nThỏa thuận cho vay;\n\nb)\n\nBáo cáo thực trạng tài chính của khách hàng;\n\nc)\nQuyết định cho vay có chữ ký điện tử của người có thẩm quyền;\ntrường hợp quyết định tập thể, phải có biên bản ghi rõ quyết định được thông qua;\nd)\nThông tin, dữ liệu nhận biết khách hàng (nếu có); thông tin, dữ liệu\nphát sinh trong quá trình sử dụng khoản vay liên quan đến thỏa thuận cho vay\ntheo hướng dẫn của tổ chức tín dụng.\n33g.2. VCB phải lưu giữ hồ sơ cho vay; thời hạn lưu giữ hồ sơ cho vay\nthực hiện theo quy định của pháp luật.\n24\n\n\fĐiều 33h. Phương tiện thanh toán được sử dụng để giải ngân vốn cho vay\nĐơn vị sử dụng các phương tiện thanh toán để giải ngân vốn cho vay theo\nquy định của NHNN về phương thức giải ngân vốn cho vay của tổ chức tín dụng\nđối với khách hàng. Trường hợp khách hàng là cá nhân vay vốn phục vụ nhu cầu\nđời sống và được nhận biết, xác minh thông tin nhận biết khách hàng theo quy\nđịnh tại Điều 33b Quyết định này, Đơn vị được xem xét, quyết định việc giải\nngân vốn cho vay vào tài khoản thanh toán của khách hàng tại tổ chức cung ứng\ndịch vụ thanh toán để khách hàng thanh toán, chi trả cho bên thụ hưởng theo mục\nđích vay vốn phục vụ nhu cầu đời sống mà khách hàng cam kết.\nCHƯƠNG III\nTỔ CHỨC THỰC HIỆN\nĐiều 34. Điều khoản chuyển tiếp\n34.1. Các hợp đồng tín dụng được ký kết trước ngày Quy định này có hiệu\nlực thi hành được tiếp tục thực hiện theo các nội dung trong hợp đồng tín dụng đã\nký kết phù hợp với quy định của pháp luật và quy định của VCB có hiệu lực thi\nhành tại thời điểm ký kết hợp đồng tín dụng đó hoặc Đơn vị và khách hàng có thể\nthỏa thuận về việc sửa đổi, bổ sung hợp đồng tín dụng phù hợp với Quy định này.\n34.2. Trường hợp áp dụng phương thức cho vay theo hạn mức tín dụng,\nhạn mức tín dụng dự phòng, hạn mức thấu chi trên tài khoản thanh toán, nếu\ntrong nội dung hợp đồng tín dụng không thỏa thuận thời hạn duy trì hạn mức tín\ndụng, hạn mức thấu chi trên tài khoản thanh toán, thời hạn hiệu lực của hạn mức\ntín dụng dự phòng, thì Đơn vị và khách hàng có thể tiếp tục thực hiện các nội\ndung trong hợp đồng tín dụng đã ký kết phù hợp với quy định của pháp luật có\nhiệu lực thi hành tại thời điểm ký kết hợp đồng nhưng thời hạn duy trì của hạn\nmức tín dụng, hạn mức thấu chi trên tài khoản thanh toán, thời hạn hiệu lực của\nhạn mức tín dụng dự phòng tối đa không vượt quá 01 (một) năm kể từ ngày Quy\nđịnh này có hiệu lực thi hành.\nĐiều 35. Tổ chức thực hiện\n35.1. Đối với các văn bản hướng dẫn của VCB ban hành trước ngày Quy\nđịnh này có hiệu lực, Đơn vị tiếp tục thực hiện cho đến khi có văn bản thay\nthế/sửa đổi, bổ sung (nếu có) đảm bảo nguyên tắc các nội dung không phù hợp\nvới Quy định này thì Đơn vị thực hiện theo quy định tại Quy định này.\n35.2. Trường hợp nội dung một phần/toàn bộ văn bản hướng dẫn của\nVCB ban hành trước ngày Quy định này có hiệu lực trái với Quy định này thì\nmột phần nội dung/văn bản đó hết hiệu lực thi hành kể từ ngày Quy định này có\nhiệu lực.\n25\n\n\f35.3. Tổng Giám đốc quy định chi tiết việc thực hiện nhưng không được\ntrái với Quy định này. Các văn bản hướng dẫn liên quan phải được gửi cho\nHĐQT ngay sau khi ban hành.\n35.4. Việc sửa đổi, bổ sung Quy định này do HĐQT xem xét, quyết định\nbằng văn bản.\n\nTM.HỘI ĐỒNG QUẢN TRỊ\nCHỦ TỊCH\n\n26\n\n\f"</script>
    <script>
        const tabs = document.querySelectorAll(".tabs button");
        const source = JSON.parse(document.getElementById("loanRegulationSource").textContent);
        const noResult = document.getElementById("noResult");
        const search = document.getElementById("documentSearch");
        const panelData = {
            khcn: { title: "Quy trình tín dụng KHCN", placeholder: true },
            khbb: { title: "Quy trình tín dụng KHBB", placeholder: true },
            regulation: { title: "Quy chế cho vay", sections: buildRegulationSections(source) },
            authority: { title: "Thẩm quyền phê duyệt tín dụng", placeholder: true },
            cards: { title: "Chính sách thẻ tín dụng", placeholder: true },
            collateral: { title: "Chính sách bảo đảm tín dụng", placeholder: true }
        };

        function buildRegulationSections(text) {
            const bodyStart = text.indexOf("QUY ĐỊNH VỀ CHO VAY ĐỐI VỚI KHÁCH HÀNG", text.indexOf("MỤC LỤC"));
            const body = bodyStart >= 0 ? text.slice(bodyStart) : text;
            const headings = [...body.matchAll(/(?:^|\n)(CHƯƠNG [IVX]+(?:\s*\n[^\n]*)?|MỤC \d+\.\s*[^\n]+|Điều \d+[a-zA-ZđĐ]*\.)/g)];
            if (!headings.length) return [{ title: "Toàn văn quy chế", text: body }];
            return headings.map((heading, index) => ({
                title: heading[1].replace(/\s+/g, " ").trim(),
                text: body.slice(heading.index + heading[0].lastIndexOf(heading[1]),
                    index + 1 < headings.length ? headings[index + 1].index : body.length).trim()
            })).filter((section) => section.text.length > 20);
        }

        function fold(value) {
            return (value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .replace(/đ/gi, "d").toLowerCase();
        }

        function escapeHtml(value) {
            return (value || "").replace(/[&<>"']/g, (character) => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            }[character]));
        }

        function highlight(value, keyword) {
            if (!keyword) return escapeHtml(value);
            const raw = value || "";
            const folded = fold(raw);
            const needle = fold(keyword);
            if (!needle) return escapeHtml(raw);
            let output = "", cursor = 0, hit;
            while ((hit = folded.indexOf(needle, cursor)) !== -1) {
                output += escapeHtml(raw.slice(cursor, hit));
                output += "<mark>" + escapeHtml(raw.slice(hit, hit + needle.length)) + "</mark>";
                cursor = hit + needle.length;
            }
            return output + escapeHtml(raw.slice(cursor));
        }

        function applySearch() {
            const keyword = search.value.trim();
            const needle = fold(keyword);
            let matches = 0;
            Object.entries(panelData).forEach(([id, data]) => {
                const panel = document.getElementById("panel-" + id);
                if (data.placeholder) {
                    panel.innerHTML = `<div class="card-block"><h3>${data.title}</h3><p class="placeholder">Chưa có dữ liệu.</p></div>`;
                    panel.style.display = "";
                    return;
                }
                const sections = data.sections || [];
                const foundSections = sections.filter((section) => !needle || fold(section.title + " " + section.text).includes(needle));
                const found = foundSections.length > 0;
                panel.style.display = found ? "" : "none";
                if (found) {
                    matches++;
                    panel.innerHTML = foundSections.map((section) => `
                        <div class="card-block searchable">
                            <h3>${highlight(section.title, keyword)}</h3>
                            <div class="document">${highlight(section.text, keyword)}</div>
                        </div>
                    `).join("");
                }
            });
            noResult.style.display = needle && matches === 0 ? "block" : "none";
        }

        document.getElementById("closeAll").addEventListener("click", () => {
            search.value = "";
            applySearch();
        });
        search.addEventListener("input", applySearch);
        tabs.forEach((tab) => tab.addEventListener("click", () => {
            tabs.forEach((item) => item.classList.remove("active"));
            document.querySelectorAll(".panel").forEach((panel) => panel.classList.remove("active"));
            tab.classList.add("active");
            document.getElementById("panel-" + tab.dataset.tab).classList.add("active");
            applySearch();
        }));
        applySearch();
    </script>
</body>
