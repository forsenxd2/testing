<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quy trình</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #fff; color: #228B22; }
        .container { max-width: 1500px; margin: 32px auto 40px; padding: 0 20px; }
        .content-box { background: #fff8dc; border-radius: 8px; padding: 20px; box-shadow: 0 2px 4px rgba(0,0,0,.1); }
        .main-title { color: #228B22; font-weight: 700; text-align: center; margin-bottom: 8px; text-transform: uppercase; font-size: 1.6rem; }
        .doc-meta { color: #555; text-align: center; font-size: .9rem; font-style: italic; margin-bottom: 20px; }
        .back-btn { min-width: 160px; }
        .search-wrap { position: sticky; top: 0; z-index: 5; background: #fff8dc; padding: 10px 0 12px; }
        .search-hint, .scope-label { color: #555; font-size: .88rem; }
        .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
        .tabs button { flex: 1 1 150px; border: 1px solid #cfe3cf; border-radius: 8px; background: #fff; color: #176117; font-weight: 700; padding: 11px 12px; cursor: pointer; }
        .tabs button:hover, .tabs button.active { background: #eaf5e7; border-color: #228B22; }
        .panel { display: none; }
        .panel.active { display: block; }
        .card-block { border: 1px solid #cfe3cf; border-radius: 8px; background: #fff; padding: 14px 16px; margin-bottom: 10px; color: #2f2f2f; }
        .card-block h3 { color: #1f6f1f; font-size: 1rem; margin: 0 0 8px; }
        .summary-list { margin: 0; padding-left: 1.15rem; color: #2d3a2d; font-size: .9rem; }
        .summary-list li { margin-bottom: 7px; line-height: 1.5; }
        .summary-table { width: 100%; border-collapse: collapse; color: #2d3a2d; font-size: .88rem; }
        .summary-table th, .summary-table td { border: 1px solid #dcdcc0; padding: 7px 9px; vertical-align: top; }
        .summary-table th { background: #f2f8f0; color: #1f6f1f; text-align: left; }
        .policy-table-wrap { overflow-x: auto; margin: 8px 0; }
        .policy-table-wrap .summary-table { min-width: 680px; }
        .policy-details { border: 1px solid #d8e8d2; border-radius: 7px; margin: 8px 0; background: #fbfdf9; }
        .policy-details summary { cursor: pointer; padding: 10px 12px; color: #1f6f1f; font-weight: 700; }
        .policy-details summary:hover { background: #eef7eb; }
        .policy-details .details-body { padding: 0 12px 12px; }
        .policy-note { border-left: 4px solid #228B22; background: #f2f8f0; padding: 10px 12px; margin: 8px 0 12px; color: #2d3a2d; }
        .flowchart-trigger { display: block; width: 100%; border: 1px solid #dcdcc0; border-radius: 6px; padding: 6px; background: #fff; cursor: zoom-in; }
        .flowchart-trigger img { display: block; width: 100%; max-height: 360px; object-fit: contain; }
        .flowchart-caption { color: #555; font-size: .88rem; margin: 6px 0 0; }
        .flowchart-dialog { border: 0; border-radius: 8px; padding: 12px; width: min(96vw, 1500px); max-width: none; max-height: 96vh; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
        .flowchart-dialog::backdrop { background: rgba(0,0,0,.78); }
        .flowchart-dialog img { display: block; width: 100%; max-height: calc(96vh - 70px); object-fit: contain; }
        mark { background: #ffe066; padding: 0 1px; }
        .placeholder { color: #777; font-style: italic; padding: 4px 0; }
        .no-result { color: #a33; font-weight: 600; padding: 14px 4px; }
        @media (max-width: 768px) {
            .container { padding: 0 12px; }
            .tabs { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content-box">
            <div class="d-flex justify-content-end mb-3">
                <button type="button" class="btn btn-secondary btn-sm fw-bold back-btn" onclick="window.history.back()">
                    <i class="bi bi-arrow-left"></i> Quay lại
                </button>
            </div>

            <h1 class="main-title">Quy trình và quy định nghiệp vụ</h1>
            <div class="doc-meta">Tra cứu tập trung các quy trình, quy định và hướng dẫn nghiệp vụ</div>

            <div class="search-wrap">
                <input id="documentSearch" type="text" class="form-control"
                    placeholder="Tra cứu nội dung: điều kiện vay, hồ sơ, lãi suất, tài sản bảo đảm...">
                <div class="d-flex flex-wrap align-items-center gap-2 mt-2">
                    <button type="button" id="closeAll" class="btn btn-outline-secondary btn-sm">Xóa tìm kiếm</button>
                </div>
                <div class="search-hint mt-1">Chọn một tab để xem nội dung. Kết quả tìm kiếm sẽ được tô sáng.</div>
            </div>

            <div class="tabs">
                <button type="button" class="active" data-tab="khcn">Quy trình tín dụng KHCN</button>
                <button type="button" data-tab="khbb">Quy trình tín dụng KHBB</button>
                <button type="button" data-tab="regulation">Quy chế cho vay</button>
                <button type="button" data-tab="authority">Thẩm quyền phê duyệt tín dụng</button>
                <button type="button" data-tab="cards">Chính sách thẻ tín dụng</button>
                <button type="button" data-tab="collateral">Chính sách bảo đảm tín dụng</button>
            </div>

            <div id="panels">
                <div class="panel active" id="panel-khcn"></div>
                <div class="panel" id="panel-khbb"></div>
                <div class="panel" id="panel-regulation"></div>
                <div class="panel" id="panel-authority"></div>
                <div class="panel" id="panel-cards"></div>
                <div class="panel" id="panel-collateral"></div>
            </div>
            <div id="noResult" class="no-result" style="display:none;">Không tìm thấy nội dung phù hợp.</div>
        </div>
    </div>

    <dialog class="flowchart-dialog" id="flowchartDialog" aria-label="Sơ đồ quy trình phóng to">
        <div class="d-flex justify-content-between align-items-center gap-3 mb-2">
            <strong id="flowchartDialogTitle"></strong>
            <button type="button" class="btn btn-secondary btn-sm" id="closeFlowchart">Đóng</button>
        </div>
        <img id="flowchartDialogImage" alt="">
    </dialog>

    <script src="credit-card-groups.js"></script>
    <script>
        const tabs = document.querySelectorAll(".tabs button");
        const noResult = document.getElementById("noResult");
        const search = document.getElementById("documentSearch");
        const panelData = {
            khcn: { title: "Quy trình tín dụng KHCN", sections: [
                {
                    title: "1. Phạm vi, vai trò và nguyên tắc kiểm soát",
                    keys: "khách hàng cá nhân KHCN phạm vi PGD cán bộ quan hệ khách hàng thẩm định phê duyệt độc lập xung đột lợi ích",
                    html: "<div class='policy-note'><strong>Nguồn:</strong> Quy trình tín dụng KHCN ban hành kèm QĐ 2507/QĐ-VCB-QLRRTD ngày 28/12/2020, sửa đổi bởi QĐ 510 ngày 31/12/2020 và QĐ 1074 ngày 25/06/2021 theo tài liệu cung cấp. Đây là bản tra cứu quy trình, không thay thế quy định sản phẩm/thẩm quyền cập nhật.</div><ul class='summary-list'><li>Áp dụng tại Trụ sở chính và Chi nhánh khi cấp tín dụng khách hàng cá nhân; không bao gồm bao thanh toán, chiết khấu miễn truy đòi bộ chứng từ L/C và phát hành thẻ tín dụng.</li><li><strong>Phân vai:</strong> CBKH tiếp nhận, thu thập hồ sơ và lập báo cáo nhu cầu; CBTĐ thẩm định, chấm điểm/xếp hạng nếu áp dụng, đề xuất và theo dõi khoản vay; CRC thẩm định/định giá tài sản theo phân công, nhập hệ thống, kiểm tra điều kiện giải ngân, tác nghiệp và lưu hồ sơ. QLNCVĐ quản lý khoản cấp tín dụng có vấn đề và phải độc lập với chức năng thẩm định.</li><li>Người thẩm định/người phê duyệt không thẩm định/phê duyệt khách hàng là chính mình hoặc người có liên quan; thẩm định, quyết định và tác nghiệp phải được phân tách theo quy định.</li><li><strong>PGD:</strong> không có thẩm quyền phê duyệt tín dụng. Nếu không có CBTĐ (hoặc CBTĐ vắng mặt, không có người thay), Lãnh đạo PGD thực hiện thẩm định, trình GĐCN; sau phê duyệt, CBKH PGD tiếp tục các việc tác nghiệp được giao. PGD không được thẩm định/đề xuất nếu Lãnh đạo PGD có dưới <strong>01 năm</strong> kinh nghiệm tín dụng và/hoặc PGD không có CBKH, trừ khoản vay được bảo đảm đầy đủ bằng tiền, tiền gửi/tiết kiệm tại VCB, GTCG do VCB phát hành, trái phiếu Chính phủ hoặc tín phiếu Kho bạc.</li><li>Khi khoản của khách hàng PGD vượt thẩm quyền GĐCN, PGD tiếp nhận ban đầu rồi chuyển KHCN tại Chi nhánh/TSC thực hiện thẩm định và trình cấp phù hợp; PGD tiếp tục tác nghiệp sau khi có phê duyệt. Bảo lãnh và tài trợ thương mại của KHCN đi theo quy trình riêng tương ứng, không thuộc phạm vi các bước cho vay trong tab này.</li></ul>"
                },
                {
                    title: "2. Tiếp nhận, thẩm định và trình phê duyệt",
                    keys: "tiếp nhận hồ sơ báo cáo nhu cầu tín dụng thẩm định nguồn trả nợ phương án xếp hạng rủi ro tài sản bảo đảm",
                    html: "<ol class='summary-list'><li><strong>Tiếp nhận:</strong> CBKH kiểm tra hồ sơ pháp lý và hồ sơ phương án sử dụng vốn về tính đầy đủ, hợp lệ, rõ ràng, thống nhất; làm rõ nhu cầu, mục đích vay, nguồn trả nợ và TSBĐ. Thiếu/sai hồ sơ thì yêu cầu bổ sung; đủ hồ sơ thì lập BC NCTD và chuyển CBTĐ.</li><li><strong>Thẩm định độc lập:</strong> CBTĐ xác minh tư cách pháp lý, điều kiện cấp tín dụng và giới hạn liên quan; đánh giá tính khả thi/hiệu quả/rủi ro của phương án, khả năng tài chính và nguồn trả nợ, lịch sử quan hệ/xếp hạng tín dụng nếu áp dụng, TSBĐ và điều kiện quản lý. CBTĐ chủ động thu thập thêm thông tin, làm việc với khách hàng khi cần.</li><li><strong>TSBĐ:</strong> hồ sơ được chuyển bộ phận thẩm định giá theo quy trình riêng; CBTĐ lập đề xuất biện pháp bảo đảm trên cơ sở kết quả định giá. Phê duyệt biện pháp/giá trị tài sản có thể trình cùng hồ sơ tín dụng nếu bảo đảm đủ nội dung và đúng cấp có thẩm quyền.</li><li><strong>Rà soát và quyết định:</strong> Lãnh đạo P.KHCN/PGD rà soát, nêu rõ ý kiến và lý do nếu không đồng ý/chỉnh sửa; cấp có thẩm quyền ghi rõ đồng ý, đồng ý kèm điều kiện, từ chối hoặc trình cấp cao hơn. Hồ sơ vượt Chi nhánh được chuyển P.PDTD rà soát rủi ro trước khi trình cấp quyết định.</li><li>Trường hợp HĐTDCS phê duyệt, lập thông báo theo biên bản họp; bản sao gửi thành viên HĐTDCS chậm nhất <strong>03 ngày làm việc</strong> từ ngày thông báo được ký/đóng dấu. Từ chối cấp tín dụng phải ghi rõ lý do; không được tự ý nới điều kiện đã duyệt khi đàm phán với khách hàng.</li></ol>"
                },
                {
                    title: "3. Hoàn thiện hợp đồng và điều kiện trước giải ngân",
                    keys: "hợp đồng tín dụng HĐTD hợp đồng bảo đảm đăng ký biện pháp bảo đảm nhập hệ thống lưu hồ sơ điều kiện giải ngân",
                    html: "<ol class='summary-list'><li>Sau phê duyệt, thông báo đúng nội dung, điều kiện và thời hạn cho khách hàng; chuẩn bị HĐTD, HĐBĐ và văn bản liên quan bám sát phê duyệt. Nếu khách hàng không chấp nhận điều kiện, lập hồ sơ trình điều chỉnh, không tự sửa nội dung.</li><li>Hoàn tất ký đúng người đại diện/ủy quyền, công chứng/chứng thực và đăng ký biện pháp bảo đảm khi pháp luật hoặc VCB yêu cầu. Xác nhận từng điều kiện trước giải ngân và lưu tài liệu chứng minh.</li><li>CRC kiểm tra hồ sơ, nhập thông tin khách hàng, khoản vay, hợp đồng và TSBĐ trên hệ thống; người kiểm soát đối chiếu dữ liệu với phê duyệt/hồ sơ gốc trước khi duyệt. Hồ sơ khách hàng, hồ sơ tín dụng và hồ sơ TSBĐ được phân loại/lưu riêng theo quy trình quản lý.</li><li>Đối với hồ sơ PGD chuyển scan màu, đối chiếu bản scan với bản giấy trước tác nghiệp. PGD có kho đạt chuẩn gửi bản gốc về BPCRC chậm nhất ngày làm việc cuối cùng của tuần; không có kho đạt chuẩn thì chuyển trong ngày làm việc theo mốc của từng loại hồ sơ.</li></ol>"
                },
                {
                    title: "4. Kiểm tra hồ sơ rút vốn và giải ngân",
                    keys: "rút vốn giải ngân giấy nhận nợ chứng từ mục đích sử dụng vốn hạn mức còn lại điều kiện tín dụng",
                    html: "<ul class='summary-list'><li>Hồ sơ rút vốn tối thiểu gồm giấy nhận nợ có chữ ký hợp lệ; giấy tờ chứng minh mục đích vay/lần giải ngân (hợp đồng, đề nghị thanh toán, hóa đơn/chứng từ phù hợp); và ủy nhiệm chi, giấy rút tiền/lệnh chuyển tiền hoặc chứng từ tương đương. Kiểm tra số tiền, mục đích, điều kiện trong phê duyệt/HĐTD và hạn mức còn được giải ngân.</li><li>CBTĐ đánh giá tình hình khách hàng và lập thông báo đủ điều kiện; Lãnh đạo kiểm soát. CRC kiểm tra lần nữa tính hợp lệ, điều kiện và hạn mức, mở tài khoản vay nếu cần, nhập/duyệt hệ thống rồi chuyển bộ phận dịch vụ khách hàng thực hiện thanh toán.</li><li><strong>Dừng/không giải ngân:</strong> hồ sơ chưa đủ hoặc sai lệch; mục đích không phù hợp HĐTD; điều kiện tiên quyết chưa hoàn tất; hoặc xuất hiện rủi ro khiến khách hàng có thể không trả nợ đầy đủ, đúng hạn. Ghi rõ nội dung thiếu/lý do từ chối và chuyển đúng cấp xem xét; không dùng thông báo tác nghiệp để thay đổi phê duyệt.</li><li><strong>PGD:</strong> scan màu hồ sơ gửi Chi nhánh để xử lý, kiểm soát khớp bản scan và bản giấy. Nếu có kho đạt chuẩn, chuyển bản gốc chậm nhất ngày làm việc cuối tuần; nếu không có kho đạt chuẩn, chuyển trong ngày giải ngân. Bản gốc giấy nhận nợ, chứng từ thanh toán và hồ sơ liên quan phân giao cho khách hàng, DVKH và CRC lưu theo quy định.</li></ul>"
                },
                {
                    title: "5. Thu nợ, giám sát và xử lý dấu hiệu rủi ro",
                    keys: "thu nợ nhắc nợ lãi suất kiểm tra sử dụng vốn kiểm tra tại chỗ từ xa tần suất 6 tháng 12 tháng quá hạn nợ có vấn đề",
                    html: "<div class='policy-table-wrap'><table class='summary-table'><thead><tr><th>Công việc</th><th>Mốc/tần suất và yêu cầu</th></tr></thead><tbody><tr><td>Nhắc nợ đến hạn</td><td>CBTĐ chủ động nhắc khách hàng trước ngày đến hạn; CRC tính/kiểm tra nợ gốc, lãi, phí, chuyển dữ liệu cho DVKH thu nợ. Nếu nguồn thu không đủ, theo dõi chuyển quá hạn và báo CBTĐ.</td></tr><tr><td>Kiểm tra tại chỗ - vay phục vụ kinh doanh hoặc bảo lãnh phục vụ đời sống</td><td>Tối thiểu 01 lần/06 tháng; đồng thời thu thập báo cáo thực trạng tài chính theo quy định.</td></tr><tr><td>Kiểm tra tại chỗ - vay tiêu dùng phục vụ đời sống</td><td>Lần đầu chậm nhất 01 tháng sau giải ngân; các lần tiếp theo tối thiểu 01 lần/12 tháng; cập nhật báo cáo tình hình thu nhập (nếu chưa tích hợp vào biên bản/báo cáo kiểm tra).</td></tr><tr><td>Kiểm soát từ xa</td><td>Chậm nhất 06 tháng từ lần cấp tín dụng đầu tiên với khách hàng mới và/hoặc từ lần kiểm soát từ xa gần nhất. Nếu trùng kỳ kiểm tra tại chỗ, có thể ghi nhận chung nhưng phải đủ nội dung của cả hai hình thức.</td></tr><tr><td>Điều chỉnh lãi suất</td><td>CRC cập nhật vào ngày điều chỉnh theo HĐTD/giấy nhận nợ; thông báo cho khách hàng muộn nhất ngày đầu tiên của kỳ tính lãi liền kề, theo phương thức đã thỏa thuận.</td></tr><tr><td>PGD chuyển hồ sơ giải ngân gốc</td><td>Không có kho đủ chuẩn: trong ngày giải ngân; có kho đủ chuẩn: chậm nhất ngày làm việc cuối cùng của tuần.</td></tr></tbody></table></div><ul class='summary-list mt-2'><li>Nội dung kiểm tra gồm sử dụng vốn đúng mục đích; thực hiện nghĩa vụ theo HĐTD/bảo lãnh; tình hình kinh doanh, tài chính và nguồn trả nợ; tài sản hình thành từ vốn vay; TSBĐ và dấu hiệu ảnh hưởng quyền của VCB. CBTĐ có thể đề xuất kiểm tra đột xuất/tăng tần suất.</li><li>Khi khoản vay chuyển quá hạn, BPCRC báo ngay CBTĐ; đơn vị gửi thông báo chuyển nợ quá hạn, tiếp tục đôn đốc và tăng kiểm tra. Khoản cấp tín dụng có vấn đề theo định nghĩa quy trình gồm khoản từ nhóm nợ 2 trở lên và các trường hợp khác theo quy định VCB; chuyển BP QLNCVĐ quản lý theo quy trình riêng. Đây là nhánh khác với xử lý nợ quá hạn thông thường.</li><li>Phát hiện khách hàng chậm trả, không hợp tác, suy giảm nguồn trả nợ, TSBĐ có vấn đề hoặc hồ sơ scan/bản gốc không khớp thì xác minh nguyên nhân, báo cáo cấp có thẩm quyền và thực hiện biện pháp đã duyệt; không tiếp tục giải ngân nếu điều kiện hoặc kiểm soát bắt buộc chưa đáp ứng.</li></ul>"

                    html: `<p>Hàng hóa cần được nhận diện, kiểm đếm, kiểm soát chất lượng và có phương án quản lý xuất - nhập phù hợp. Sáu phương thức trong hướng dẫn khác nhau về nơi lưu kho, bên quản lý và quyền xuất kho; không coi điều kiện của phương thức này là điều kiện thay thế cho phương thức khác.</p><div class="policy-table-wrap"><table class="summary-table"><thead><tr><th>Phương thức quản lý</th><th>Nguyên tắc tra cứu</th><th>Kiểm tra thực tế tối thiểu</th></tr></thead><tbody><tr><td>1. Cầm cố tại kho VCB</td><td>VCB hoặc bên thứ ba quản lý kho; xuất kho theo Biện pháp 1.</td><td>VCB quản lý: 01 lần/03 tháng; bên thứ ba quản lý: 01 lần/tháng.</td></tr><tr><td>2. Thế chấp tại kho bên thứ ba, xuất theo Biện pháp 1</td><td>Bên thứ ba do VCB và bên bảo đảm cùng lựa chọn/thỏa thuận; VCB giám sát bàn giao.</td><td>Ít nhất 01 lần/tháng.</td></tr><tr><td>3. Thế chấp tại kho bên thứ ba, xuất theo Biện pháp 2</td><td>Chỉ xuất khi bên quản lý kho đồng ý và số lượng/giá trị không thấp hơn mức lưu kho tối thiểu.</td><td>Ít nhất 01 lần/tháng.</td></tr><tr><td>4-5. Thế chấp tại kho bên bảo đảm, xuất theo Biện pháp 1 hoặc 2</td><td>Chỉ nhận chính thức khi hàng hóa đủ điều kiện, dễ kiểm đếm/đánh giá và đáp ứng yêu cầu quản lý kho; phương thức 5 kiểm soát xuất qua bên quản lý kho.</td><td>Ít nhất 01 lần/tháng.</td></tr><tr><td>6. Thế chấp tại kho bên bảo đảm, xuất theo Biện pháp 3</td><td>Bên bảo đảm tự quản lý và chủ động xuất nhập nhưng giá trị luôn không thấp hơn giá trị lưu kho tối thiểu; có điều kiện riêng để nhận chính thức.</td><td>Kiểm soát theo phương án được duyệt; trường hợp không dễ xác định số lượng/chất lượng cần đơn vị độc lập kiểm đếm/kiểm định.</td></tr></tbody></table></div>
                        <details class="policy-details"><summary>Điều kiện bảo quản kho thường gặp trong phụ lục</summary><div class="details-body"><div class="policy-table-wrap"><table class="summary-table"><thead><tr><th>Hàng hóa</th><th>Yêu cầu kho cần lưu ý</th></tr></thead><tbody><tr><td>Xăng dầu</td><td>Kho/bể chứa phân khu riêng, thiết kế theo tiêu chuẩn quốc gia về kho chứa xăng dầu.</td></tr><tr><td>Gỗ nguyên liệu</td><td>Kho có mái che, chống mưa/nắng trực tiếp, mối mọt/côn trùng và có phòng cháy chữa cháy.</td></tr><tr><td>Giấy</td><td>Kho có mái che, nền khô/cách ẩm, thoáng khí, chống mối mọt; kiểm tra thường xuyên và có phòng cháy chữa cháy.</td></tr><tr><td>Than</td><td>Kho khô ráo, không đọng nước; bề mặt sạch để tránh lẫn tạp chất.</td></tr><tr><td>Thủy sản đông lạnh</td><td>Kho lạnh duy trì nhiệt độ từ -18°C đến -20°C; bố trí lối đi thuận tiện xếp dỡ.</td></tr><tr><td>Nông sản</td><td>Kho kín, có tường/mái che, thoáng mát, kết cấu vững; cách nguồn ô nhiễm và có biện pháp ngăn động vật/vi sinh vật.</td></tr><tr><td>Phân bón</td><td>Phân khu riêng (tối thiểu 3 gian cho lân, đạm, kali); nền xi măng/gạch, cao và tránh vật liệu hút ẩm.</td></tr><tr><td>Dược phẩm, hóa chất</td><td>Kho thoáng mát, tránh nắng/nhiệt cao; có phòng cháy chữa cháy.</td></tr><tr><td>Thực phẩm, đồ uống</td><td>Kho sạch, khô/thoáng, kiểm soát côn trùng; sữa theo nhiệt độ nhà sản xuất; đồ uống cần bố trí kệ/lối đi và phòng cháy chữa cháy.</td></tr></tbody></table></div></div></details>
                        <ul class="summary-list"><li>Xuất kho theo Biện pháp 1 phải có văn bản đồng ý của Trưởng đơn vị, căn cứ khách hàng trả nợ tương ứng, thay bằng TSBĐ khác tương đương hoặc trường hợp được chấp thuận. Biện pháp 2 cần bên quản lý kho đồng ý và duy trì lượng/giá trị tồn tối thiểu; Biện pháp 3 cho phép bên bảo đảm chủ động xuất nhập nhưng luôn phải duy trì giá trị lưu kho tối thiểu.</li><li>Định giá lại hàng hóa tại mỗi lần kiểm tra thực tế hoặc khi giá thị trường giảm làm tổng giá trị hàng hóa bảo đảm có khả năng giảm từ <strong>20%</strong> trở lên. Nếu giá trị giảm, yêu cầu bổ sung/thay thế TSBĐ và/hoặc trả nợ tương ứng. Tra cứu đăng ký biện pháp bảo đảm đối với hàng hóa tối thiểu <strong>01 lần/tháng</strong>.</li></ul>`
                },
                {
                    title: "8. Quyền tài sản và bảo lãnh",
                    keys: "quyền tài sản quyền đòi nợ hợp đồng thuê quyền thuê hợp đồng mua bán nhà dự án thu nợ 24 tháng 120 ngày bảo lãnh chính phủ tổ chức tín dụng thư tín dụng dự phòng SBLC xếp hạng",
                    html: `<details class="policy-details"><summary>Quyền đòi nợ, quyền phát sinh từ hợp đồng và quyền thuê</summary><div class="details-body"><ul class="summary-list"><li><strong>Quyền đòi nợ:</strong> hợp đồng làm phát sinh quyền đòi nợ không cấm/hạn chế chuyển nhượng; bên bảo đảm có quyền sở hữu khoản phải thu, khoản phải thu chưa thế chấp nơi khác, phương thức và thời hạn thanh toán xác định; đánh giá khả năng thanh toán/tranh chấp của bên có nghĩa vụ.</li><li>Thông báo cho bên có nghĩa vụ về việc thế chấp và đề nghị xác nhận; ưu tiên dòng tiền trả nợ về tài khoản tại VCB. Khi nhận quyền đòi nợ có bảo lãnh thanh toán, yêu cầu chuyển quyền thụ hưởng bảo lãnh cho VCB.</li><li>Quyền phát sinh từ hợp đồng thuê nhà ở/văn phòng/địa điểm kinh doanh: thời hạn thuê còn lại dài hơn thời hạn khoản tín dụng còn lại ít nhất <strong>24 tháng</strong>; địa điểm và khả năng chuyển nhượng phải phù hợp; hợp đồng phải cho phép thế chấp/chuyển nhượng quyền thuê và VCB được thụ hưởng quyền lợi khi xử lý.</li><li>Quyền khai thác tài nguyên thiên nhiên: thời hạn còn lại dài hơn thời hạn khoản tín dụng còn lại ít nhất <strong>120 ngày</strong>. Quyền thuê đất/hạ tầng khu công nghiệp có điều kiện riêng, thường gồm thời hạn thuê còn lại dài hơn khoản tín dụng ít nhất <strong>05 năm</strong>, tài sản gắn liền với đất được thế chấp và có thỏa thuận/đăng ký phù hợp.</li><li>Quyền tài sản từ hợp đồng mua bán nhà ở/tài sản gắn liền với đất phải gắn với khoản tín dụng hình thành chính tài sản đó; dự án đủ điều kiện kinh doanh, hợp đồng hợp pháp và thỏa thuận quản lý/xử lý với chủ đầu tư theo quy định.</li></ul><div class="policy-table-wrap"><table class="summary-table"><thead><tr><th>Quyền tài sản/điều kiện cụ thể</th><th>Trần tối đa</th><th>Ưu tiên</th></tr></thead><tbody><tr><td>Quyền đòi nợ hiện có dưới 12 tháng, có bảo lãnh thanh toán của TCTD đủ điều kiện / TCTD khác</td><td>70% / 20%</td><td>3</td></tr><tr><td>Quyền đòi nợ hiện có dưới 12 tháng, không có bảo lãnh: bên có nghĩa vụ không phải DN mới thành lập, xếp hạng PD từ B+ và có xác nhận theo quy định / nhánh khách hàng từ BB+ có quan hệ tín dụng, tài khoản thanh toán tại VCB và không có xác nhận</td><td>50% / 20%</td><td>3</td></tr><tr><td>Quyền đòi nợ theo bộ chứng từ xuất trình tại VCB: ngân hàng phát hành/xác nhận đủ điều kiện đã chấp nhận thanh toán / không đủ điều kiện / chưa chấp nhận nhưng đủ điều kiện</td><td>70% / 20% / 50%</td><td>3</td></tr><tr><td>Quyền khai thác tài nguyên thiên nhiên / quyền sở hữu trí tuệ</td><td>40% / 0%</td><td>3</td></tr><tr><td>Quyền từ hợp đồng thuê dài hạn văn phòng/địa điểm kinh doanh</td><td>40%</td><td>3</td></tr><tr><td>Quyền từ hợp đồng mua bán nhà ở / tài sản khác gắn liền với đất</td><td>70% / 65%</td><td>3</td></tr><tr><td>Quyền khai thác, sử dụng hạ tầng khu/cụm công nghiệp, khu công nghệ cao đủ điều kiện / quyền thuê trong hợp đồng thuê đất đủ điều kiện</td><td>60% / 55%</td><td>3</td></tr><tr><td>Quyền tài sản khác</td><td>0%</td><td>3</td></tr><tr><td>Địa điểm kinh doanh tại chợ đủ điều kiện / tài sản định giá theo giá thu mua phế liệu / phần vốn góp doanh nghiệp</td><td>40% / 0% / 0%</td><td>3</td></tr></tbody></table></div><p class="scope-label">Các tỷ lệ quyền đòi nợ phụ thuộc đầy đủ điều kiện về kỳ hạn, xếp hạng, xác nhận của bên có nghĩa vụ/ngân hàng và danh sách loại trừ; không áp dụng nếu thiếu điều kiện.</p></div></details><details class="policy-details"><summary>Biện pháp bảo lãnh</summary><div class="details-body"><p>Bảo lãnh của TCTD/tổ chức nước ngoài có thể bao gồm thư tín dụng dự phòng (SBLC); kiểm tra hiệu lực, thẩm quyền ký, nội dung cam kết, điều kiện yêu cầu thanh toán và pháp luật áp dụng.</p><div class="policy-table-wrap"><table class="summary-table"><thead><tr><th>Loại bảo lãnh không được bảo đảm bằng ký quỹ/cầm cố/thế chấp</th><th>Trần tối đa</th><th>Ưu tiên</th></tr></thead><tbody><tr><td>Bảo lãnh Chính phủ</td><td>100%</td><td>1</td></tr><tr><td>Bảo lãnh TCTD, định chế tài chính hoặc tổ chức khác thuộc danh mục/đáp ứng điều kiện được Hội đồng tín dụng Trung ương phê duyệt</td><td>100%</td><td>2</td></tr><tr><td>Bảo lãnh doanh nghiệp đáp ứng điều kiện tại Chính sách BĐTD</td><td>20%</td><td>3</td></tr><tr><td>Bảo lãnh VDB/quỹ bảo lãnh tín dụng cho DNNVV</td><td>0%, trừ chương trình/quy định tín dụng cho phép</td><td>3</td></tr><tr><td>Bảo lãnh của tổ chức khác</td><td>0%</td><td>3</td></tr><tr><td>Bảo lãnh có nghĩa vụ được bảo đảm bằng ký quỹ/cầm cố/thế chấp</td><td>Theo TSBĐ bảo đảm nghĩa vụ bảo lãnh</td><td>3</td></tr></tbody></table></div><ul class="summary-list"><li>Đánh giá năng lực pháp lý/tài chính, xếp hạng và điều kiện của bên bảo lãnh/tổ chức phát hành theo đúng nhóm được Chính sách BĐTD cho phép. Trường hợp đơn vị/ngân hàng chưa có trong danh sách được thông báo, liên hệ đầu mối tại Trụ sở chính để xác minh điều kiện/danh sách loại trừ.</li><li>Ưu tiên cầm cố/thế chấp tài sản thay cho bảo lãnh được bảo đảm bằng ký quỹ, cầm cố hoặc thế chấp. Bảo lãnh doanh nghiệp nhà nước cho công ty con có các giới hạn về hệ số nợ và giá trị bảo lãnh theo vốn chủ sở hữu/vốn góp; bảo lãnh không được dùng cho các trường hợp bị Chính sách BĐTD loại trừ.</li></ul></div></details>`
                },
                {
                    title: "9. Định giá, định giá lại và kiểm tra thực tế",
                    keys: "định giá thẩm định giá bắt buộc thuê thẩm định giá 5 tỷ 4 tỷ 3 tỷ 2 tỷ 10 tỷ 20% định giá lại hàng tháng hàng năm cổ phiếu 6 tháng 3 tháng kiểm tra thực tế",
                    html: `<ul class="summary-list"><li><strong>Phương thức:</strong> tự định giá, Trung tâm định giá tài sản hoặc thuê tổ chức thẩm định giá theo quy định; tổ chức phải thuộc danh sách VCB/đáp ứng điều kiện. Cán bộ vẫn phải thẩm định pháp lý và hiện trạng. Khi đồng thời tự định giá và thuê ngoài, lấy mức thấp hơn; cấp phê duyệt có thể duyệt bằng hoặc thấp hơn chứng thư.</li><li><strong>Các ngưỡng thuê thẩm định giá đáng chú ý:</strong> QSD đất không phải đất nông nghiệp/đất thuê có giá trị trên <strong>5 tỷ đồng</strong>, khoản tín dụng được bảo đảm trên <strong>4 tỷ đồng</strong> và giá trị vượt ngưỡng so với bảng giá đất (3 lần tại quận nội thành Hà Nội/TP.HCM/Đà Nẵng; 2 lần tại phường nội thành Hải Phòng/Huế/Nha Trang/Vũng Tàu/Cần Thơ/Bình Dương/Biên Hòa; 1,5 lần trường hợp khác); đất nông nghiệp trên <strong>3 tỷ đồng</strong> bảo đảm khoản trên <strong>2 tỷ đồng</strong>; phương tiện đã qua sử dụng trên <strong>2 tỷ đồng</strong> bảo đảm khoản trên <strong>1 tỷ đồng</strong>; máy móc/dây chuyền/xe máy chuyên dùng trên <strong>10 tỷ đồng</strong> bảo đảm khoản trên <strong>4 tỷ đồng</strong>; tài sản có lợi thế thương mại. Có ngoại lệ với tài sản thuộc phạm vi Trung tâm định giá tài sản.</li><li><strong>Định giá lại:</strong> cổ phiếu niêm yết tối thiểu <strong>01 lần/tháng</strong>; nhóm 13 hàng hóa tối thiểu <strong>01 lần/06 tháng</strong>; các nhóm khác theo tần suất tại bảng nhóm (thường 01 lần/năm), trừ trường hợp đặc biệt. Bất động sản nhóm 1, không thay đổi và không có thông tin bất lợi, tỷ lệ giá trị TSBĐ/dư nợ từ 2 lần trở lên có thể áp dụng cơ chế riêng: từ 3 lần định giá lại khi cần/ theo cấp phê duyệt; từ 2 đến dưới 3 lần tối thiểu 01 lần/02 năm.</li><li><strong>Kiểm tra thực tế:</strong> phương tiện vận tải, máy móc/dây chuyền, xe máy chuyên dùng tối thiểu <strong>01 lần/06 tháng</strong>; nếu khoản cấp tín dụng có vấn đề tối thiểu <strong>01 lần/03 tháng</strong>. Nhóm khác theo chu kỳ tại Phụ lục 2 và khi có dấu hiệu rủi ro.</li><li>Định giá lại sớm khi có biến động, giải chấp một phần, phát sinh thông tin bất lợi hoặc cấp phê duyệt/VCB yêu cầu. Khi giá trị giảm khiến tỷ lệ bảo đảm không đạt, yêu cầu bổ sung tài sản/thay thế hoặc giảm dư nợ.</li></ul>`
                },
                {
                    title: "10. Tài sản không nhận, tỷ lệ bảo đảm và giới hạn không có TSBĐ",
                    keys: "không nhận bảo đảm tài sản cấm đất thuê cổ phiếu trái phiếu phá sản giải thể tài sản nhà nước 500 tỷ tổ chức gia đình dư nợ không có bảo đảm tỷ lệ 70%",
                    html: `<details class="policy-details"><summary>Nhóm tài sản cần sàng lọc loại trừ</summary><div class="details-body"><ul class="summary-list"><li>Hàng hóa/tài sản bị cấm kinh doanh, giao dịch; tài sản pháp luật hoặc VCB cấm nhận; tài sản không đủ căn cứ sở hữu/quyền sử dụng, đang tranh chấp, kê biên hoặc phong tỏa.</li><li>Danh mục đất cần đặc biệt kiểm tra gồm: QSD đất còn ghi nợ/chưa hoàn thành nghĩa vụ tài chính; đất thuê trả tiền hằng năm trừ trường hợp ngoại lệ theo luật; đất giao không thu tiền; đất tôn giáo/tín ngưỡng, sân bay, quốc phòng-an ninh; đất rừng phòng hộ/rừng đặc dụng, rừng sản xuất là rừng tự nhiên; đất công cộng không kinh doanh, sông/ngòi/kênh/rạch/suối và đất cộng đồng giao không thu tiền; các trường hợp khác tại Phụ lục 1.</li><li>Nhà/tài sản đã có quyết định thu hồi, giải tỏa hoặc thuộc trường hợp không được giao dịch; tài sản thuộc sở hữu Nhà nước/đơn vị sự nghiệp hình thành từ ngân sách trong trường hợp bị loại trừ; cổ phiếu quỹ, cổ phiếu hình thành từ vốn vay, cổ phiếu của VCB/công ty con/liên kết và các trường hợp vay để mua chính cổ phiếu/trái phiếu đó; tài sản doanh nghiệp giải thể/phá sản và các trường hợp cụ thể khác trong Phụ lục 1.</li><li>Danh sách trên là nhóm sàng lọc chính, không thay thế việc kiểm tra đầy đủ Phụ lục 1 và quy định pháp luật.</li></ul></div></details><ul class="summary-list"><li>Tỷ lệ bảo đảm của khoản tín dụng được tính từ tổng giá trị từng tài sản sau khi áp dụng tỷ lệ cấp tín dụng tối đa tương ứng, chia cho nghĩa vụ được bảo đảm; yêu cầu tỷ lệ tối thiểu theo sản phẩm/quy định hiện hành và phê duyệt. Tài sản hình thành từ vốn vay mua bất động sản có thể áp dụng tỷ lệ thấp hơn trong giai đoạn hoàn tất chuyển nhượng/thế chấp chỉ khi có quy định sản phẩm và biện pháp kiểm soát được duyệt.</li><li>Dư nợ cho vay và đầu tư trái phiếu doanh nghiệp <strong>không có bảo đảm</strong> của khách hàng/nhóm khách hàng có công ty mẹ hoặc tổ chức mang tính chất tư nhân, gia đình không vượt <strong>500 tỷ đ                 },
                {
                    title: "11. Quản lý hồ sơ, bảo hiểm và xử lý tài sản",
                    keys: "quản lý hồ sơ TSBĐ hợp đồng công chứng đăng ký bảo hiểm cháy nổ công trình xây dựng bảo hiểm giữ hộ 30 ngày giải chấp xử lý thu hồi nợ",
                    html: `<ul class="summary-list"><li>Hoàn thiện hợp đồng bảo đảm, công chứng/chứng thực và đăng ký biện pháp bảo đảm theo pháp luật; lưu hồ sơ gốc, theo dõi tình trạng tài sản, quyền ưu tiên, bảo hiểm và ngày định giá lại. Nếu VCB là bên nhận sau bên khác/hợp vốn không giữ bản gốc, lưu bản sao chứng thực hoặc có xác nhận của bên giữ bản gốc.</li><li>Tài sản tại cơ sở có nguy hiểm cháy, nổ theo danh mục pháp luật phải mua bảo hiểm cháy nổ bắt buộc; số tiền bảo hiểm tối thiểu theo giá thị trường, hoặc giá trị còn lại/thay thế với nhà, công trình, máy móc và theo hóa đơn/chứng từ với hàng hóa. Một số công trình phải mua bảo hiểm trong thời gian xây dựng; kiểm tra phạm vi, số tiền và thời hạn bảo hiểm theo quy định hiện hành.</li><li>Khi hợp đồng bảo đảm chấm dứt, thông báo khách hàng/bên bảo đảm nhận lại tài sản và hồ sơ; hướng dẫn hợp nhất nêu mốc xác nhận trong <strong>30 ngày làm việc</strong>. Nếu không nhận lại/không xác nhận, chuyển trạng thái giữ hộ theo quy trình.</li><li>Khi phát sinh căn cứ xử lý, thực hiện theo thỏa thuận và quy trình VCB; có thể xử lý một/nhiều tài sản. Nếu tiền thu được không đủ thanh toán nghĩa vụ, khách hàng vẫn phải trả phần còn thiếu.</li></ul>`
                },
            ] }
        };

        function fold(value) {
            return (value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .replace(/đ/gi, "d").toLowerCase();
        }

        function escapeHtml(value) {
            return (value || "").replace(/[&<>"']/g, (character) => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            }[character]));
        }

        function highlight(value, keyword) {
            if (!keyword) return escapeHtml(value);
            const raw = value || "";
            const folded = fold(raw);
            const needle = fold(keyword);
            if (!needle) return escapeHtml(raw);
            let output = "", cursor = 0, hit;
            while ((hit = folded.indexOf(needle, cursor)) !== -1) {
                output += escapeHtml(raw.slice(cursor, hit));
                output += "<mark>" + escapeHtml(raw.slice(hit, hit + needle.length)) + "</mark>";
                cursor = hit + needle.length;
            }
            return output + escapeHtml(raw.slice(cursor));
        }

        function renderCustomerGroupDirectory(container) {
            if (!container || !window.creditCardCustomerGroups) return;
            const limits = {
                "1": ["Chức danh do Bộ Chính trị quyết định", "01 tỷ VND"],
                "2": ["Chức danh do Ban Bí thư quyết định", "01 tỷ VND"],
                "3": ["Cán bộ quản lý cao cấp", "700 triệu VND"],
                "4": ["Quản lý cao cấp cấp Vụ và tương đương", "500 triệu VND"]
            };
            const groups = window.creditCardCustomerGroups;
            container.innerHTML = `<input type="search" class="form-control form-control-sm mb-2" data-group-search placeholder="Lọc cơ quan, đơn vị, chức danh trong nhóm 1-4...">` +
                Object.keys(limits).map((group) => {
                    const rows = groups[group] || [];
                    const rowsHtml = rows.map((row) => `<tr data-group-row data-search-text="${escapeHtml([row.agency, row.units, row.positions].join(" "))}"><td>${escapeHtml(row.agency)}</td><td>${escapeHtml(row.units)}</td><td>${escapeHtml(row.positions)}</td></tr>`).join("");
                    return `<details class="policy-details" data-group-details><summary>Nhóm ${group} - ${limits[group][0]} <span class="badge text-bg-success">${limits[group][1]}</span></summary><div class="details-body"><table class="summary-table"><thead><tr><th>Cơ quan</th><th>Đơn vị trực thuộc</th><th>Chức danh áp dụng</th></tr></thead><tbody>${rowsHtml}</tbody></table></div></details>`;
                }).join("");
            const groupSearch = container.querySelector("[data-group-search]");
            groupSearch.addEventListener("input", () => {
                const keyword = fold(groupSearch.value.trim());
                container.querySelectorAll("[data-group-details]").forEach((details) => {
                    let visible = 0;
                    details.querySelectorAll("[data-group-row]").forEach((row) => {
                        const matched = !keyword || fold(row.dataset.searchText).includes(keyword);
                        row.style.display = matched ? "" : "none";
                        if (matched) visible++;
                    });
                    details.style.display = visible ? "" : "none";
                    if (keyword && visible) details.open = true;
                });
            });
        }

        function applySearch() {
            const keyword = search.value.trim();
            const needle = fold(keyword);
            let matches = 0;
            Object.entries(panelData).forEach(([id, data]) => {
                const panel = document.getElementById("panel-" + id);
                if (data.placeholder) {
                    panel.innerHTML = `<div class="card-block"><h3>${data.title}</h3><p class="placeholder">Chưa có dữ liệu.</p></div>`;
                    panel.style.display = "";
                    return;
                }
                const sections = data.sections || [];
                const foundSections = sections.filter((section) => {
                    const searchableText = section.title + " " + section.keys + " " + section.html.replace(/<[^>]*>/g, " ");
                    return !needle || fold(searchableText).includes(needle);
                });
                const found = foundSections.length > 0;
                panel.style.display = found ? "" : "none";
                if (found) {
                    matches++;
                    panel.innerHTML = foundSections.map((section) => `
                        <div class="card-block searchable">
                            <h3>${highlight(section.title, keyword)}</h3>
                            ${section.html}
                        </div>
                    `).join("");
                    const customerGroupDirectory = panel.querySelector("#customerGroupDirectory");
                    renderCustomerGroupDirectory(customerGroupDirectory);
                }
            });
            noResult.style.display = needle && matches === 0 ? "block" : "none";
        }

        const flowchartDialog = document.getElementById("flowchartDialog");
        const flowchartDialogImage = document.getElementById("flowchartDialogImage");
        const flowchartDialogTitle = document.getElementById("flowchartDialogTitle");
        document.getElementById("panels").addEventListener("click", (event) => {
            const trigger = event.target.closest("[data-flowchart-src]");
            if (!trigger) return;
            flowchartDialogImage.src = trigger.dataset.flowchartSrc;
            flowchartDialogImage.alt = trigger.querySelector("img")?.alt || "";
            flowchartDialogTitle.textContent = trigger.dataset.flowchartTitle || "";
            flowchartDialog.showModal();
        });
        document.getElementById("closeFlowchart").addEventListener("click", () => flowchartDialog.close());
        flowchartDialog.addEventListener("click", (event) => {
            if (event.target === flowchartDialog) flowchartDialog.close();
        });

        document.getElementById("closeAll").addEventListener("click", () => {
            search.value = "";
            applySearch();
        });
        search.addEventListener("input", applySearch);
        tabs.forEach((tab) => tab.addEventListener("click", () => {
            tabs.forEach((item) => item.classList.remove("active"));
            document.querySelectorAll(".panel").forEach((panel) => panel.classList.remove("active"));
            tab.classList.add("active");
            document.getElementById("panel-" + tab.dataset.tab).classList.add("active");
            applySearch();
        }));
        applySearch();
    </script>
