<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quy trình</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #fff; color: #228B22; }
        .container { max-width: 1500px; margin: 32px auto 40px; padding: 0 20px; }
        .content-box { background: #fff8dc; border-radius: 8px; padding: 20px; box-shadow: 0 2px 4px rgba(0,0,0,.1); }
        .main-title { color: #228B22; font-weight: 700; text-align: center; margin-bottom: 8px; text-transform: uppercase; font-size: 1.6rem; }
        .doc-meta { color: #555; text-align: center; font-size: .9rem; font-style: italic; margin-bottom: 20px; }
        .back-btn { min-width: 160px; }
        .search-wrap { position: sticky; top: 0; z-index: 5; background: #fff8dc; padding: 10px 0 12px; }
        .search-hint, .scope-label { color: #555; font-size: .88rem; }
        .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
        .tabs button { flex: 1 1 150px; border: 1px solid #cfe3cf; border-radius: 8px; background: #fff; color: #176117; font-weight: 700; padding: 11px 12px; cursor: pointer; }
        .tabs button:hover, .tabs button.active { background: #eaf5e7; border-color: #228B22; }
        .panel { display: none; }
        .panel.active { display: block; }
        .card-block { border: 1px solid #cfe3cf; border-radius: 8px; background: #fff; padding: 14px 16px; margin-bottom: 10px; color: #2f2f2f; }
        .card-block h3 { color: #1f6f1f; font-size: 1rem; margin: 0 0 8px; }
        .summary-list { margin: 0; padding-left: 1.15rem; color: #2d3a2d; font-size: .9rem; }
        .summary-list li { margin-bottom: 7px; line-height: 1.5; }
        .summary-table { width: 100%; border-collapse: collapse; color: #2d3a2d; font-size: .88rem; }
        .summary-table th, .summary-table td { border: 1px solid #dcdcc0; padding: 7px 9px; vertical-align: top; }
        .summary-table th { background: #f2f8f0; color: #1f6f1f; text-align: left; }
        .policy-details { border: 1px solid #d8e8d2; border-radius: 7px; margin: 8px 0; background: #fbfdf9; }
        .policy-details summary { cursor: pointer; padding: 10px 12px; color: #1f6f1f; font-weight: 700; }
        .policy-details summary:hover { background: #eef7eb; }
        .policy-details .details-body { padding: 0 12px 12px; }
        .policy-note { border-left: 4px solid #228B22; background: #f2f8f0; padding: 10px 12px; margin: 8px 0 12px; color: #2d3a2d; }
        .flowchart-trigger { display: block; width: 100%; border: 1px solid #dcdcc0; border-radius: 6px; padding: 6px; background: #fff; cursor: zoom-in; }
        .flowchart-trigger img { display: block; width: 100%; max-height: 360px; object-fit: contain; }
        .flowchart-caption { color: #555; font-size: .88rem; margin: 6px 0 0; }
        .flowchart-dialog { border: 0; border-radius: 8px; padding: 12px; width: min(96vw, 1500px); max-width: none; max-height: 96vh; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
        .flowchart-dialog::backdrop { background: rgba(0,0,0,.78); }
        .flowchart-dialog img { display: block; width: 100%; max-height: calc(96vh - 70px); object-fit: contain; }
        mark { background: #ffe066; padding: 0 1px; }
        .placeholder { color: #777; font-style: italic; padding: 4px 0; }
        .no-result { color: #a33; font-weight: 600; padding: 14px 4px; }
        @media (max-width: 768px) {
            .container { padding: 0 12px; }
            .tabs { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content-box">
            <div class="d-flex justify-content-end mb-3">
                <button type="button" class="btn btn-secondary btn-sm fw-bold back-btn" onclick="window.history.back()">
                    <i class="bi bi-arrow-left"></i> Quay lại
                </button>
            </div>

            <h1 class="main-title">Quy trình và quy định nghiệp vụ</h1>
            <div class="doc-meta">Tra cứu tập trung các quy trình, quy định và hướng dẫn nghiệp vụ</div>

            <div class="search-wrap">
                <input id="documentSearch" type="text" class="form-control"
                    placeholder="Tra cứu nội dung: điều kiện vay, hồ sơ, lãi suất, tài sản bảo đảm...">
                <div class="d-flex flex-wrap align-items-center gap-2 mt-2">
                    <button type="button" id="closeAll" class="btn btn-outline-secondary btn-sm">Xóa tìm kiếm</button>
                </div>
                <div class="search-hint mt-1">Chọn một tab để xem nội dung. Kết quả tìm kiếm sẽ được tô sáng.</div>
            </div>

            <div class="tabs">
                <button type="button" class="active" data-tab="khcn">Quy trình tín dụng KHCN</button>
                <button type="button" data-tab="khbb">Quy trình tín dụng KHBB</button>
                <button type="button" data-tab="regulation">Quy chế cho vay</button>
                <button type="button" data-tab="authority">Thẩm quyền phê duyệt tín dụng</button>
                <button type="button" data-tab="cards">Chính sách thẻ tín dụng</button>
                <button type="button" data-tab="collateral">Chính sách bảo đảm tín dụng</button>
            </div>

            <div id="panels">
                <div class="panel active" id="panel-khcn"></div>
                <div class="panel" id="panel-khbb"></div>
                <div class="panel" id="panel-regulation"></div>
                <div class="panel" id="panel-authority"></div>
                <div class="panel" id="panel-cards"></div>
                <div class="panel" id="panel-collateral"></div>
            </div>
            <div id="noResult" class="no-result" style="display:none;">Không tìm thấy nội dung phù hợp.</div>
        </div>
    </div>

    <dialog class="flowchart-dialog" id="flowchartDialog" aria-label="Sơ đồ quy trình phóng to">
        <div class="d-flex justify-content-between align-items-center gap-3 mb-2">
            <strong id="flowchartDialogTitle"></strong>
            <button type="button" class="btn btn-secondary btn-sm" id="closeFlowchart">Đóng</button>
        </div>
        <img id="flowchartDialogImage" alt="">
    </dialog>

    <script src="credit-card-groups.js"></script>
    <script>
        const tabs = document.querySelectorAll(".tabs button");
        const noResult = document.getElementById("noResult");
        const search = document.getElementById("documentSearch");
        const panelData = {
            khcn: { title: "Quy trình tín dụng KHCN", placeholder: true },
            khbb: { title: "Quy trình tín dụng KHBB", placeholder: true },
            regulation: { title: "Quy chế cho vay", sections: [
                {
                    title: "1. Phạm vi và đối tượng áp dụng",
                    keys: "phạm vi đối tượng khách hàng đơn vị chi nhánh",
                    html: "<ul class='summary-list'><li>Áp dụng cho hoạt động cho vay đối với khách hàng không phải là tổ chức tín dụng.</li><li>Áp dụng thống nhất tại Trụ sở chính, Chi nhánh VCB và khách hàng vay vốn tại VCB.</li><li>Đơn vị cho vay thực hiện theo pháp luật hiện hành, quy định của VCB và các văn bản hướng dẫn liên quan.</li></ul>"
                },
                {
                    title: "2. Nguyên tắc cho vay",
                    keys: "nguyên tắc tự chủ mục đích hoàn trả vốn vay",
                    html: "<ul class='summary-list'><li>VCB tự chủ và chịu trách nhiệm về quyết định cho vay; có quyền từ chối yêu cầu không phù hợp quy định.</li><li>Khoản vay phải được sử dụng đúng mục đích, hoàn trả gốc và lãi đúng hạn.</li><li>Trường hợp pháp luật thay đổi, áp dụng quy định mới của pháp luật.</li></ul>"
                },
                {
                    title: "3. Điều kiện vay vốn",
                    keys: "điều kiện năng lực pháp luật tài chính mục đích khả năng trả nợ",
                    html: "<ul class='summary-list'><li>Khách hàng có năng lực pháp luật/năng lực hành vi dân sự phù hợp.</li><li>Mục đích sử dụng vốn hợp pháp và có phương án sử dụng vốn khả thi.</li><li>Có khả năng tài chính để trả nợ; trường hợp cần thiết phải có biện pháp bảo đảm theo quy định.</li><li>Khách hàng cung cấp thông tin, tài liệu trung thực và chịu trách nhiệm về tính chính xác.</li></ul>"
                },
                {
                    title: "4. Hồ sơ đề nghị vay vốn",
                    keys: "hồ sơ giấy tờ đề nghị vay vốn phương án tài chính pháp lý",
                    html: "<ul class='summary-list'><li>Hồ sơ pháp lý và thông tin nhận diện khách hàng, người đại diện và bên liên quan.</li><li>Hồ sơ chứng minh mục đích vay, phương án/dự án sử dụng vốn và nguồn trả nợ.</li><li>Hồ sơ chứng minh khả năng tài chính, thu nhập hoặc hiệu quả hoạt động kinh doanh.</li><li>Hồ sơ tài sản bảo đảm và giấy tờ liên quan theo yêu cầu từng khoản vay.</li><li>Đơn vị được yêu cầu bổ sung tài liệu cần thiết theo đặc điểm khoản vay.</li></ul>"
                },
                {
                    title: "5. Nhu cầu vốn không được cho vay",
                    keys: "không được cho vay cấm trả nợ gửi tiền đầu tư ngành nghề",
                    html: "<ul class='summary-list'><li>Nhu cầu thuộc ngành, nghề cấm đầu tư kinh doanh hoặc trái quy định pháp luật.</li><li>Nhu cầu dùng để thanh toán chi phí, giao dịch hoặc hàng hóa, dịch vụ bị cấm.</li><li>Dùng để trả nợ khoản cấp tín dụng tại chính VCB, trừ trường hợp được quy định riêng.</li><li>Dùng để gửi tiền hoặc thực hiện các mục đích bị loại trừ theo quy định của VCB và pháp luật.</li></ul>"
                },
                {
                    title: "6. Loại khoản vay, đồng tiền và mức cho vay",
                    keys: "ngắn hạn trung hạn dài hạn đồng tiền mức cho vay",
                    html: "<table class='summary-table'><thead><tr><th>Nội dung</th><th>Tóm tắt tra cứu</th></tr></thead><tbody><tr><td>Ngắn hạn</td><td>Thời hạn tối đa 01 năm.</td></tr><tr><td>Trung hạn</td><td>Thời hạn trên 01 năm đến 05 năm.</td></tr><tr><td>Dài hạn</td><td>Thời hạn trên 05 năm.</td></tr><tr><td>Đồng tiền</td><td>Thỏa thuận theo quy định pháp luật và khả năng đáp ứng của VCB; trả nợ theo đồng tiền cho vay, trừ trường hợp được phép khác.</td></tr><tr><td>Mức cho vay</td><td>Xác định trên cơ sở nhu cầu vốn, khả năng trả nợ, giới hạn cấp tín dụng, giá trị bảo đảm và quy định sản phẩm.</td></tr></tbody></table>"
                },
                {
                    title: "7. Lãi suất và phí",
                    keys: "lãi suất phí trong hạn quá hạn điều chỉnh",
                    html: "<ul class='summary-list'><li>Lãi suất do VCB và khách hàng thỏa thuận, phù hợp cơ chế điều hành và quy định từng thời kỳ.</li><li>Thỏa thuận phải thể hiện mức lãi suất, phương pháp tính, kỳ điều chỉnh và các nội dung liên quan.</li><li>Lãi trên dư nợ quá hạn áp dụng khi khách hàng không trả đúng hạn theo mức quy định.</li><li>Phí liên quan đến hoạt động cho vay thực hiện theo thỏa thuận và biểu phí/quy định của VCB.</li></ul>"
                },
                {
                    title: "8. Bảo đảm tiền vay và cung cấp thông tin",
                    keys: "bảo đảm tài sản xử lý thông tin khách hàng",
                    html: "<ul class='summary-list'><li>Việc có hoặc không có bảo đảm tiền vay được quyết định theo quy định pháp luật, chính sách sản phẩm và phê duyệt khoản vay.</li><li>Khách hàng/bên bảo đảm phải phối hợp đăng ký, quản lý và xử lý tài sản khi phát sinh nghĩa vụ.</li><li>VCB cung cấp thông tin cần thiết về khoản vay; khách hàng phải cung cấp đầy đủ, trung thực và kịp thời thông tin.</li></ul>"
                },
                {
                    title: "9. Thẩm định và quyết định cho vay",
                    keys: "thẩm định phê duyệt quyết định từ chối khả năng đáp ứng",
                    html: "<ul class='summary-list'><li>Đơn vị thẩm định điều kiện vay, mục đích sử dụng vốn, khả năng trả nợ, rủi ro và tài sản bảo đảm.</li><li>Quyết định cho vay phải đúng thẩm quyền, hạn mức và quy trình nội bộ.</li><li>Nếu không cho vay, Đơn vị thông báo cho khách hàng theo quy định.</li><li>Thỏa thuận cho vay chỉ được ký kết sau khi hoàn tất phê duyệt và các điều kiện tiên quyết.</li></ul>"
                },
                {
                    title: "10. Giải ngân, trả nợ và cơ cấu lại thời hạn",
                    keys: "giải ngân trả nợ trước hạn cơ cấu gia hạn điều chỉnh kỳ hạn",
                    html: "<ul class='summary-list'><li>Giải ngân theo đúng mục đích, hồ sơ và điều kiện đã được phê duyệt.</li><li>Lịch trả nợ gốc/lãi căn cứ thỏa thuận và đặc điểm phương án; trả trước hạn thực hiện theo thỏa thuận.</li><li>Cơ cấu lại thời hạn trả nợ gồm điều chỉnh kỳ hạn hoặc gia hạn nợ, trên cơ sở đề nghị, khả năng tài chính và phê duyệt đúng thẩm quyền.</li><li>Khi cơ cấu, khách hàng phải gửi hồ sơ và phương án trả nợ phù hợp.</li></ul>"
                },
                {
                    title: "11. Nợ quá hạn, chấm dứt cho vay và xử lý nợ",
                    keys: "nợ quá hạn chấm dứt thu hồi xử lý nợ miễn giảm",
                    html: "<ul class='summary-list'><li>Chuyển nợ quá hạn đối với dư nợ gốc khách hàng không trả đúng hạn và thông báo cho khách hàng.</li><li>VCB có thể chấm dứt cho vay, thu hồi nợ trước hạn khi khách hàng vi phạm thỏa thuận hoặc có dấu hiệu ảnh hưởng khả năng trả nợ.</li><li>Xử lý nợ, tài sản bảo đảm, miễn/giảm lãi hoặc phí thực hiện theo thẩm quyền và quy định hiện hành.</li></ul>"
                },
                {
                    title: "12. Thỏa thuận, kiểm tra và lưu giữ hồ sơ",
                    keys: "thỏa thuận hợp đồng kiểm tra sử dụng vốn lưu giữ hồ sơ biểu mẫu",
                    html: "<ul class='summary-list'><li>Thỏa thuận cho vay lập bằng văn bản hoặc hình thức điện tử hợp pháp, với các nội dung tối thiểu theo quy định.</li><li>VCB kiểm tra việc sử dụng vốn, khả năng trả nợ và tình hình tài chính trong thời hạn vay.</li><li>Hồ sơ khoản vay, chứng từ giải ngân, thu nợ và tài liệu kiểm tra phải được lưu giữ đầy đủ, an toàn theo thời hạn quy định.</li></ul>"
                }
            ] },
            authority: { title: "Thẩm quyền phê duyệt tín dụng", placeholder: true },
            cards: { title: "Chính sách thẻ tín dụng", sections: [
                {
                    title: "Tổng quan và phạm vi áp dụng",
                    keys: "quy định phát hành thẻ tín dụng cá nhân XHTDNB mục đích phạm vi quyết định 67 617 707 2303 346 448 2100",
                    html: "<div class='policy-note'><strong>Văn bản tra cứu:</strong> Quy định về phát hành thẻ tín dụng cá nhân theo hệ thống chấm điểm xếp hạng tín dụng nội bộ (XHTDNB), đã được sửa đổi, bổ sung qua các văn bản được nêu trong DOCX.</div><ul class='summary-list'><li>Mục đích: chuẩn hóa việc đánh giá khách hàng, quyết định hạn mức tín dụng thẻ và quản lý phát hành thẻ trên toàn hệ thống.</li><li>Phạm vi: Hội sở chính, Sở giao dịch, Chi nhánh, Phòng giao dịch, Trung tâm Thẻ và cá nhân/bộ phận liên quan.</li><li>Đối tượng chấm điểm: khách hàng cá nhân là chủ thẻ chính khi phát hành sản phẩm thẻ tín dụng VCB.</li><li>Hệ thống XHTDNB tự động tính điểm, xếp hạng và hạn mức theo bộ chỉ tiêu, tham số thống nhất; cán bộ chịu trách nhiệm về thông tin nhập vào hệ thống.</li></ul>"
                },
                {
                    title: "1. Phân loại sản phẩm thẻ",
                    keys: "phân loại sản phẩm thẻ không bảo đảm có bảo đảm tài sản bảo đảm bảo lãnh toàn bộ một phần nhóm 1 15 16 17 18 19",
                    html: "<table class='summary-table'><thead><tr><th>Nhóm sản phẩm</th><th>Đối tượng/đặc điểm tra cứu</th></tr></thead><tbody><tr><td>Không có bảo đảm</td><td>Thẻ cá nhân áp dụng cho nhóm 1-15; thẻ dành cho CBNV VCB áp dụng nhóm 16.</td></tr><tr><td>Có TSBĐ</td><td>TSBĐ toàn bộ áp dụng nhóm 17; TSBĐ một phần áp dụng nhóm 1-15.</td></tr><tr><td>Bảo lãnh</td><td>Bảo lãnh toàn bộ áp dụng nhóm 18; bảo lãnh một phần áp dụng nhóm 1-15.</td></tr><tr><td>TSBĐ của bên thứ ba</td><td>TSBĐ toàn bộ của bên thứ ba áp dụng nhóm 19; TSBĐ một phần của bên thứ ba áp dụng nhóm 1-15.</td></tr></tbody></table>"
                },
                {

                    html: "<h4 class='text-success fs-6'>Điều kiện gia hạn và phân nhóm</h4><ul class='summary-list'><li>Áp dụng cho thẻ tín dụng quốc tế cá nhân do VCB phát hành; khách hàng phải đáp ứng quy định NHNN/VCB từng thời kỳ.</li><li>Thẻ không có bảo đảm: không có nợ xấu nhóm 3-5 trong 5 năm gần nhất, nợ bán VAMC hoặc nợ đã xử lý dự phòng tại TCTD; không thuộc đối tượng hạn chế cấp tín dụng.</li><li>Thẻ có bảo đảm: tiếp tục đáp ứng điều kiện về TSBĐ/bảo lãnh theo Chính sách bảo đảm tín dụng hiện hành.</li><li><strong>GH 1:</strong> có ít nhất 1 giao dịch chi tiêu/rút tiền trong 6 tháng gần nhất; không chậm thanh toán thẻ VCB từ 30 ngày trở lên trong 2 năm gần nhất; không có các khoản nợ xấu nêu trên trong 5 năm.</li><li><strong>GH 2:</strong> không có giao dịch chi tiêu/rút tiền trong 6 tháng gần nhất; đồng thời đáp ứng điều kiện lịch sử thanh toán và nợ xấu như GH 1.</li><li><strong>GH 3:</strong> có khoản chậm thanh toán thẻ VCB từ 30 ngày trở lên trong 2 năm gần nhất và/hoặc có nợ xấu nhóm 3-5, nợ bán VAMC hoặc nợ đã xử lý dự phòng trong 5 năm gần nhất.</li><li>Nếu một khách hàng có nhiều thẻ cùng gia hạn: GH 1 và GH 2 cùng xuất hiện thì xếp toàn bộ vào GH 1; chỉ cần một thẻ thuộc GH 3 thì toàn bộ thẻ xếp GH 3.</li></ul><h4 class='text-success fs-6 mt-3'>Mốc thời gian và luồng xử lý gia hạn</h4><div class='table-responsive'><table class='summary-table'><thead><tr><th>Mốc</th><th>Công việc</th><th>Đơn vị/nhóm thực hiện</th></tr></thead><tbody><tr><td>Mùng 05 hàng tháng, trước hạn thẻ 2 tháng</td><td>TTT lấy danh sách thẻ sắp hết hạn và gửi đầu mối/ lãnh đạo Phòng Quản lý nợ TSC.</td><td>TTT</td></tr><tr><td>Trong 01 ngày làm việc từ khi nhận danh sách</td><td>Gửi dữ liệu khách hàng sang CIC tra cứu thông tin tín dụng.</td><td>P.QLN TSC</td></tr><tr><td>Trong 03 ngày làm việc từ khi nhận kết quả CIC chính xác</td><td>Cập nhật lịch sử tín dụng vào chương trình EssemCard.</td><td>P.QLN TSC</td></tr><tr><td>Trong 01 ngày làm việc sau khi có dữ liệu thẻ và CIC</td><td>EssemCard tự động phân nhóm GH 1/2/3.</td><td>EssemCard</td></tr><tr><td>Mùng 03 và mùng 08 của tháng trước tháng hết hạn 1 tháng</td><td>Gửi SMS/email mời gia hạn lần 1 và nhắc lần 2. GH 1: khách hàng có thể từ chối, không phản hồi trong 5 ngày được hiểu là đồng ý. GH 2: cần khách hàng xác nhận đồng ý; không phản hồi thì gửi nhắc lần 2 sau 5 ngày. GH 3: ghi nhận danh sách để cán bộ bán hàng liên hệ.</td><td>EssemCard</td></tr><tr><td>Tối đa 05 ngày làm việc từ khi khách hàng phản hồi/nhắc lần 2</td><td>CBBH liên hệ; với GH 3 tư vấn, thu thập hồ sơ/TSBĐ và chuyển CBTĐ chấm điểm, trình phê duyệt. GH 1/2 đủ điều kiện trình danh sách, HMTD giữ nguyên và không chấm điểm lại CR. Thực hiện không muộn hơn ngày cuối tháng liền trước tháng thẻ hết hạn, trừ trường hợp không liên hệ được.</td><td>CBBH/CBTĐ/cấp thẩm quyền</td></tr><tr><td>Khi khách hàng từ chối/không thể liên hệ, tối đa 02 tháng sau khi thẻ hết hạn</td><td>Ghi nhận kết quả và thực hiện thủ tục khóa thẻ cũ (kể cả thẻ phụ); nếu từ chối phê duyệt gia hạn, thông báo khách hàng trong 03 ngày làm việc.</td><td>CN/PGD</td></tr><tr><td>Trong 03 ngày làm việc từ khi nhận yêu cầu</td><td>TTT cập nhật hệ thống, in và gửi thẻ về Chi nhánh.</td><td>TTT</td></tr><tr><td>Trong 05 ngày làm việc từ khi nhận thẻ</td><td>Định danh khách hàng, hoàn tất hồ sơ, giao/kích hoạt thẻ và cập nhật thông tin. Nếu khách từ chối nhận thẻ/thiếu hồ sơ/không liên hệ được, thực hiện hủy thẻ và xử lý phí theo quy định.</td><td>CN/PGD, CBNV/CBBH</td></tr></tbody></table></div><p class='scope-label'>Với thẻ có bảo đảm, tiếp tục khoanh giữ tài sản và bổ sung hồ sơ bảo đảm. Quy trình/tiêu chí EssemCard có thể được điều chỉnh theo quy định hiện hành.</p>"
                },
                {
                    title: "9. Sơ đồ quy trình gia hạn thẻ",
                    keys: "sơ đồ quy trình gia hạn thẻ tín dụng GH 1 GH 2 GH 3 EssemCard CIC CBBH CBTĐ CN TTT giao thẻ hủy thẻ",
                    html: "<p class='scope-label'>Sơ đồ dưới đây thể hiện luồng gia hạn theo nhóm khách hàng, vai trò của EssemCard, P.QLN, Trung tâm Thẻ và Chi nhánh.</p><details class='policy-details'><summary>Xem sơ đồ quy trình gia hạn thẻ tín dụng cho khách hàng</summary><div class='details-body'><button type='button' class='flowchart-trigger' data-flowchart-src='images/credit-card-renewal.png' data-flowchart-title='Quy trình gia hạn thẻ tín dụng cho khách hàng' aria-label='Phóng to sơ đồ quy trình gia hạn thẻ'><img src='images/credit-card-renewal.png' alt='Sơ đồ quy trình gia hạn thẻ tín dụng cho khách hàng' loading='lazy'></button><p class='flowchart-caption'>Bấm vào sơ đồ để phóng to; bảng mốc thời gian gia hạn ở mục trước vẫn dùng để tra cứu nhanh.</p></div></details>"

                    keys: "nhắc nợ chậm thanh toán ngày đề nghị thanh toán số dư tối thiểu 60 ngày 75 ngày 180 ngày trích nợ phong tỏa khởi kiện xử lý nợ",
                    html: "<p>Thời gian được tính từ ngày đề nghị thanh toán đầu tiên mà khách hàng chưa thanh toán đủ số dư tối thiểu:</p><table class='summary-table'><thead><tr><th>Mốc thời gian</th><th>Công việc thực hiện</th><th>Đầu mối</th></tr></thead><tbody><tr><td>Sau 60 ngày</td><td>Trích nợ tài khoản của khách hàng tại VCB tương ứng với toàn bộ dư nợ, nếu khách hàng có tài khoản tại VCB.</td><td>Chi nhánh</td></tr><tr><td>Sau 75 ngày</td><td>Phong tỏa tài khoản, tài sản của khách hàng tại VCB (nếu có), như sổ tiết kiệm, giấy tờ có giá..., tương ứng với dư nợ.</td><td>Chi nhánh</td></tr><tr><td>Sau 180 ngày</td><td>Căn cứ thiện chí hợp tác và khả năng trả nợ thực tế, Giám đốc Chi nhánh xem xét khởi kiện hoặc áp dụng biện pháp xử lý nợ có vấn đề.</td><td>Giám đốc Chi nhánh</td></tr></tbody></table><div class='policy-note'>Các nội dung nhắc nợ đối với tài khoản thẻ trong thời gian dưới 180 ngày kể từ ngày đề nghị thanh toán đầu tiên được quy định chi tiết tại Quyết định 1247/QĐ-VCB.TTT ngày 13/07/2020 và văn bản sửa đổi/thay thế (nếu có). Bảng trên là mốc xử lý tóm tắt được trích từ tài liệu cung cấp.</div>"

                    title: "11. Trách nhiệm và lưu ý kiểm soát",
                    keys: "trách nhiệm cán bộ thẻ kiểm soát viên cấp phê duyệt chất lượng thông tin giám sát hồ sơ",
                    html: "<ul class='summary-list'><li>Cán bộ thẻ chịu trách nhiệm nhập thông tin chính xác, đầy đủ, phù hợp hồ sơ và kết quả thẩm định.</li><li>Kiểm soát viên, Trưởng phòng và Giám đốc Chi nhánh kiểm tra tính đầy đủ, chính xác trước khi phê duyệt.</li><li>Cấp có thẩm quyền chịu trách nhiệm về HMTD được phê duyệt và việc ủy quyền phê duyệt nếu có.</li><li>Hội sở chính, Trung tâm Thẻ và các phòng ban liên quan rà soát, kiểm tra và đánh giá việc triển khai XHTDNB.</li><li>Nội dung chưa được quy định tại văn bản này thực hiện theo Quy trình nghiệp vụ thẻ hiện hành; khi có mâu thuẫn, áp dụng quy định ưu tiên được nêu trong văn bản.</li></ul>"

            collateral: { title: "Chính sách bảo đảm tín dụng", placeholder: true }
        };

        function fold(value) {
            return (value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .replace(/đ/gi, "d").toLowerCase();
        }

        function escapeHtml(value) {
            return (value || "").replace(/[&<>"']/g, (character) => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            }[character]));
        }

        function highlight(value, keyword) {
            if (!keyword) return escapeHtml(value);
            const raw = value || "";
            const folded = fold(raw);
            const needle = fold(keyword);
            if (!needle) return escapeHtml(raw);
            let output = "", cursor = 0, hit;
            while ((hit = folded.indexOf(needle, cursor)) !== -1) {
                output += escapeHtml(raw.slice(cursor, hit));
                output += "<mark>" + escapeHtml(raw.slice(hit, hit + needle.length)) + "</mark>";
                cursor = hit + needle.length;
            }
            return output + escapeHtml(raw.slice(cursor));
        }

        function renderCustomerGroupDirectory(container) {
            if (!container || !window.creditCardCustomerGroups) return;
            const limits = {
                "1": ["Chức danh do Bộ Chính trị quyết định", "01 tỷ VND"],
                "2": ["Chức danh do Ban Bí thư quyết định", "01 tỷ VND"],
                "3": ["Cán bộ quản lý cao cấp", "700 triệu VND"],
                "4": ["Quản lý cao cấp cấp Vụ và tương đương", "500 triệu VND"]
            };
            const groups = window.creditCardCustomerGroups;
            container.innerHTML = `<input type="search" class="form-control form-control-sm mb-2" data-group-search placeholder="Lọc cơ quan, đơn vị, chức danh trong nhóm 1-4...">` +
                Object.keys(limits).map((group) => {
                    const rows = groups[group] || [];
                    const rowsHtml = rows.map((row) => `<tr data-group-row data-search-text="${escapeHtml([row.agency, row.units, row.positions].join(" "))}"><td>${escapeHtml(row.agency)}</td><td>${escapeHtml(row.units)}</td><td>${escapeHtml(row.positions)}</td></tr>`).join("");
                    return `<details class="policy-details" data-group-details><summary>Nhóm ${group} - ${limits[group][0]} <span class="badge text-bg-success">${limits[group][1]}</span></summary><div class="details-body"><table class="summary-table"><thead><tr><th>Cơ quan</th><th>Đơn vị trực thuộc</th><th>Chức danh áp dụng</th></tr></thead><tbody>${rowsHtml}</tbody></table></div></details>`;
                }).join("");
            const groupSearch = container.querySelector("[data-group-search]");
            groupSearch.addEventListener("input", () => {
                const keyword = fold(groupSearch.value.trim());
                container.querySelectorAll("[data-group-details]").forEach((details) => {
                    let visible = 0;
                    details.querySelectorAll("[data-group-row]").forEach((row) => {
                        const matched = !keyword || fold(row.dataset.searchText).includes(keyword);
                        row.style.display = matched ? "" : "none";
                        if (matched) visible++;
                    });
                    details.style.display = visible ? "" : "none";
                    if (keyword && visible) details.open = true;
                });
            });
        }

        function applySearch() {
            const keyword = search.value.trim();
            const needle = fold(keyword);
            let matches = 0;
            Object.entries(panelData).forEach(([id, data]) => {
                const panel = document.getElementById("panel-" + id);
                if (data.placeholder) {
                    panel.innerHTML = `<div class="card-block"><h3>${data.title}</h3><p class="placeholder">Chưa có dữ liệu.</p></div>`;
                    panel.style.display = "";
                    return;
                }
                const sections = data.sections || [];
                const foundSections = sections.filter((section) => {
                    const searchableText = section.title + " " + section.keys + " " + section.html.replace(/<[^>]*>/g, " ");
                    return !needle || fold(searchableText).includes(needle);
                });
                const found = foundSections.length > 0;
                panel.style.display = found ? "" : "none";
                if (found) {
                    matches++;
                    panel.innerHTML = foundSections.map((section) => `
                        <div class="card-block searchable">
                            <h3>${highlight(section.title, keyword)}</h3>
                            ${section.html}
                        </div>
                    `).join("");
                    const customerGroupDirectory = panel.querySelector("#customerGroupDirectory");
                    renderCustomerGroupDirectory(customerGroupDirectory);
                }
            });
            noResult.style.display = needle && matches === 0 ? "block" : "none";
        }

        const flowchartDialog = document.getElementById("flowchartDialog");
        const flowchartDialogImage = document.getElementById("flowchartDialogImage");
        const flowchartDialogTitle = document.getElementById("flowchartDialogTitle");
        document.getElementById("panels").addEventListener("click", (event) => {
            const trigger = event.target.closest("[data-flowchart-src]");
            if (!trigger) return;
            flowchartDialogImage.src = trigger.dataset.flowchartSrc;
            flowchartDialogImage.alt = trigger.querySelector("img")?.alt || "";
            flowchartDialogTitle.textContent = trigger.dataset.flowchartTitle || "";
            flowchartDialog.showModal();
        });
        document.getElementById("closeFlowchart").addEventListener("click", () => flowchartDialog.close());
        flowchartDialog.addEventListener("click", (event) => {
            if (event.target === flowchartDialog) flowchartDialog.close();
        });

        document.getElementById("closeAll").addEventListener("click", () => {
            search.value = "";
            applySearch();
        });
        search.addEventListener("input", applySearch);
        tabs.forEach((tab) => tab.addEventListener("click", () => {
            tabs.forEach((item) => item.classList.remove("active"));
            document.querySelectorAll(".panel").forEach((panel) => panel.classList.remove("active"));
            tab.classList.add("active");
            document.getElementById("panel-" + tab.dataset.tab).classList.add("active");
            applySearch();
        }));
        applySearch();
    </script>
