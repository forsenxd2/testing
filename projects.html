    function escapeHtml(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    function highlightText(text, keyword) {
        if (!keyword) return escapeHtml(text);
        const esc = escapeHtml(text);
        const kw = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        if (!kw) return esc;
        return esc.replace(new RegExp('(' + kw + ')', 'gi'), '<span class="highlight">$1</span>');
    }

    function flattenCell(cell) {
        if (Array.isArray(cell)) return cell.join(' ');
        return cell == null ? '' : String(cell);
    }

        const tableBits = [];
        const cols = (item.table && item.table.columns) || [];
        cols.forEach(function (col) {
            if (typeof col === 'string') {
                tableBits.push(col);
            } else {
                tableBits.push(col.label || '');
                (col.children || []).forEach(function (ch) { tableBits.push(ch); });
            }
        });
        ((item.table && item.table.rows) || []).forEach(function (row) {
            row.forEach(function (cell) { tableBits.push(flattenCell(cell)); });
        });
        return [
            item.phuLuc,
            item.nhom,
            item.investor,
            item.projects,
            (item.notes || []).join(' '),
            tableBits.join(' ')
        ].join(' ').toLowerCase();
    }

    function renderCellHtml(cell, keyword) {
        if (Array.isArray(cell)) {
            return cell.map(function (line) {
                return highlightText(line, keyword);
            }).join('<br>');
        }
        return highlightText(cell == null ? '' : String(cell), keyword);
    }

    function normalizeColumns(columns) {
        return columns.map(function (col) {
            if (typeof col === 'string') return { label: col, children: null };
            return { label: col.label, children: col.children && col.children.length ? col.children : null };
        });
    }

    function renderRateTable(item, keyword) {
        const table = item.table;
        if (!table) return '';
        const cols = normalizeColumns(table.columns || []);
        const hasNested = cols.some(function (c) { return c.children; });
        let html = '<div class="rate-block"><div class="rate-table-wrap"><table class="rate-table"><thead>';

        if (hasNested) {
            html += '<tr>';
            cols.forEach(function (col) {
                if (col.children) {
                    html += '<th colspan="' + col.children.length + '">' + highlightText(col.label, keyword) + '</th>';
                } else {
                    html += '<th rowspan="2">' + highlightText(col.label, keyword) + '</th>';
                }
            });
            html += '</tr><tr>';
            cols.forEach(function (col) {
                if (col.children) {
                    col.children.forEach(function (ch) {
                        html += '<th>' + highlightText(ch, keyword) + '</th>';
                    });
                }
            });
            html += '</tr>';
        } else {
            html += '<tr>';
            cols.forEach(function (col) {
                html += '<th>' + highlightText(col.label, keyword) + '</th>';
            });
            html += '</tr>';
        }

        html += '</thead><tbody>';
        (table.rows || []).forEach(function (row) {
            html += '<tr>';
            row.forEach(function (cell, idx) {
                const cls = idx === 0 ? '' : ' class="rate-cell"';
                html += '<td' + cls + '>' + renderCellHtml(cell, keyword) + '</td>';
            });
            html += '</tr>';
        });
        html += '</tbody></table></div>';

        if (item.notes && item.notes.length) {
            html += '<ul class="rate-notes">';
            item.notes.forEach(function (note) {
                html += '<li>' + highlightText(note, keyword) + '</li>';
            });
            html += '</ul>';
        }
        html += '</div>';
        return html;
    }

    function renderCard(item, keyword) {
        const k = keyword.trim();
        return (
            '<article class="project-card" data-id="' + escapeHtml(item.id) + '">' +
            '<div class="nhom">' + highlightText(item.phuLuc + ' · ' + item.nhom, k) + '</div>' +
            '<div class="label-row"><strong>Chủ đầu tư (CĐT):</strong> ' + highlightText(item.investor, k) + '</div>' +
            '<div class="label-row"><strong>Dự án:</strong> ' + highlightText(item.projects, k) + '</div>' +
            renderRateTable(item, k) +
            '</article>'
        );
    }

    function filterAndRender() {
        const input = document.getElementById('searchInput');
        const kw = (input && input.value) ? input.value.trim().toLowerCase() : '';
        const container = document.getElementById('cardsContainer');
        const countEl = document.getElementById('resultCount');

        const matched = !kw
            ? PROJECTS_DATA.slice()
            : PROJECTS_DATA.filter(function (item) {
                return itemSearchBlob(item).indexOf(kw) !== -1;
            });

        if (matched.length === 0) {
            container.innerHTML = '<div class="empty-hint">Không tìm thấy kết quả phù hợp. Thử từ khóa khác (tên CDT hoặc tên dự án).</div>';
            countEl.textContent = '0 phụ lục';
            return;
        }

        container.innerHTML = matched.map(function (item) {
            return renderCard(item, kw);
        }).join('');

        const total = PROJECTS_DATA.length;
        countEl.textContent = kw
            ? ('Hiển thị ' + matched.length + ' / ' + total + ' phụ lục')
            : ('Tổng ' + total + ' phụ lục');
    }

    document.addEventListener('DOMContentLoaded', function () {
        const searchInput = document.getElementById('searchInput');
        filterAndRender();
        searchInput.addEventListener('input', filterAndRender);
    });
    </script>
</body>
</html>
